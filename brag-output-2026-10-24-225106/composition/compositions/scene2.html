<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url(../assets/fonts/sg-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(../assets/fonts/sg-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../assets/fonts/sg-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../assets/fonts/jm-400.woff2) format('woff2'); }
      :root { --ground: #050505; --panel: #0d0d10; --ink: #fafafa; --muted: #a7a7b0; --accent: #38bdf8; --danger: #ff9d97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Space Grotesk', sans-serif; background: var(--ground); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #scene2 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      /* Traveling border beam: crisp conic-gradient ring, NO blur, NO shadow.
         The bright segment travels continuously around the picture border
         (4.0s per revolution, 2 revolutions = the 8s scene). */
      .picframe { --ba: 0deg; width: 1560px; padding: 4px; border-radius: 24px;
        background: conic-gradient(from var(--ba), transparent 0deg, transparent 280deg, #38bdf8 310deg, #ffffff 340deg, #38bdf8 355deg, transparent 360deg); }
      .zoomstage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 20px; background: #000; }
      /* #cam carries the camera: scale + transformOrigin are tweened by GSAP
         so the zoom focal point follows the action (composer -> send ->
         thread -> magnified answer). */
      #cam { position: absolute; inset: 0; width: 100%; height: 100%; }
      #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 20px; background: #000; }
      /* NO overlay cursor in v9: the new clip was captured from a real
         X display, so the REAL cursor already moves and clicks in the
         footage. A post arrow would show TWO cursors. Only the click
         ripple remains, as an accent on the real send click. */
      /* Click ripple: hard-edged ring, NO blur, NO shadow. */
      #ripple { position: absolute; left: 0; top: 0; width: 72px; height: 72px; border: 3px solid #38bdf8; border-radius: 50%; background: transparent; opacity: 0; z-index: 4; pointer-events: none; }
      /* Failover story as video caption text BELOW the real picture — never
         fake UI inside a mock app. */
      .cap { width: 1560px; display: flex; flex-direction: column; gap: 14px; }
      .trace { font-family: 'JetBrains Mono', monospace; font-size: 32px; line-height: 1.6; }
      .trace .fail { color: var(--danger); }
      .trace .ok { color: var(--accent); }
      .trace .hl { background: rgba(56,189,248,.14); padding: 2px 14px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene2" data-width="1920" data-height="1080" data-duration="8">
      <div id="scene2" class="clip"><div id="dashframe" class="picframe"><div class="zoomstage"><div id="cam" data-layout-allow-overflow><video id="chat-video" class="chatvid" data-layout-allow-overflow data-start="0" data-duration="8" data-media-start="0" muted playsinline preload="auto" src="../assets/vid/chat-clip-10.mp4"></video><div id="ripple"></div></div></div></div><div class="cap"><div class="trace"><span id="tracefail" class="fail">&#10005; <s>Claude</s> &middot; limit reached</span><br /><span id="traceok" class="ok hl">&#10003; Gemini continues &mdash; same memory</span></div></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Frame entrance + traveling beam (4.0s/rev x 2 = the 8s scene).
      tl.fromTo('#dashframe', { opacity: 0, y: 24, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.0);
      tl.fromTo('#dashframe', { '--ba': '0deg' }, { '--ba': '360deg', duration: 4.0, ease: 'none', repeat: 1 }, 0.0);
      // Camera, synced to the v10 clip's MEASURED timeline (scene-local =
      // edited-clip time: glide 0.0-0.7, typing 0.7-2.37 at 1.5x, send
      // click 2.85, waiting 2.97-5.07 at 2.1x, answer arrival 6.6
      // (thread clears at 6.5, answer painted by 6.7 — probed on the
      // CFR clip, never from VFR frame numbers), hold to 8.0).
      // Footage is the 60fps smooth take, cropped to the main
      // pane (NO sidebar anywhere in this scene), downsampled to 30fps —
      // every timeline frame is a real captured frame, no interpolation,
      // so motion is natively smooth. All origins are % of the stage,
      // measured from the installed clip's frames (grounded on the
      // clip's 5.1s frame): send button center clip (1820, 1024) ->
      // display (1471, 827) = 94% 94%, composer line clip y ~1010-1050,
      // answer bubble + trace clip x 70-1110, y ~495-610 -> zoom center
      // 25% 51%.
      gsap.set('#cam', { scale: 1, transformOrigin: '50% 50%' });
      gsap.set('#ripple', { x: 1435, y: 806, scale: 0.3, opacity: 0 });
      // 0.0-0.7: real cursor glides to the composer; camera pushes gently
      // toward the composer. Gentler than v9: footage is pre-cropped.
      tl.to('#cam', { scale: 1.03, transformOrigin: '50% 88%', duration: 0.7, ease: 'power2.inOut' }, 0.0);
      // 0.7-2.37: typing; camera drifts right with the growing text.
      tl.to('#cam', { scale: 1.08, transformOrigin: '55% 88%', duration: 1.67, ease: 'power1.inOut' }, 0.7);
      // 2.37-2.85: camera moves to the send button for the real click.
      tl.to('#cam', { scale: 1.08, transformOrigin: '94% 94%', duration: 0.48, ease: 'power2.inOut' }, 2.37);
      // 2.85: CLICK accent — ripple ring on the send button exactly when
      // the real message sends. (No cursor press animation: the real
      // cursor does the pressing.)
      tl.fromTo('#ripple', { scale: 0.3, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: 'power2.out', transformOrigin: '50% 50%' }, 2.85);
      // Captions, retimed to v10 beats (slide + fade).
      tl.fromTo('#tracefail', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 3.2);
      tl.fromTo('#traceok', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 6.6);
      // 2.97-4.5: waiting; camera eases back to the full thread view.
      tl.to('#cam', { scale: 1.0, transformOrigin: '50% 50%', duration: 1.53, ease: 'power1.inOut' }, 2.97);
      // 6.6-6.9: TEXT ZOOM — camera pushes onto the answer bubble +
      // trace. 1.12x is the largest push that keeps the FULL bubble in
      // frame (bubble span clip x 70-1110; visible window at 1.12x with
      // origin 25% 51% is x [51, 1765], left margin 19px — verified by
      // math). Holds to 7.7, then eases back before the fade.
      tl.to('#cam', { scale: 1.12, transformOrigin: '25% 51%', duration: 0.3, ease: 'power2.inOut' }, 6.6);
      tl.to('#cam', { scale: 1.0, transformOrigin: '50% 50%', duration: 0.25, ease: 'power2.inOut' }, 7.7);
      tl.to('#scene2', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 7.7);
      window.__timelines['scene2'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
