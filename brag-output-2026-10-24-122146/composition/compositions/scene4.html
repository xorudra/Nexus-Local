<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url(../assets/fonts/sg-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(../assets/fonts/sg-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../assets/fonts/sg-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../assets/fonts/jm-400.woff2) format('woff2'); }
      :root { --ground: #050505; --panel: #0d0d10; --ink: #fafafa; --muted: #a7a7b0; --accent: #38bdf8; --danger: #ff9d97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Space Grotesk', sans-serif; background: var(--ground); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #scene4 { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
      .beam { width: 560px; height: 3px; opacity: 0; background: linear-gradient(90deg, transparent, #38bdf8 30%, #38bdf8 70%, transparent); }
      #wordmark { font-size: 168px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); line-height: 1; }
      #tagline { font-size: 46px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
      #addr { font-size: 32px; color: var(--muted); }
      #addr b { color: var(--accent); font-weight: 500; }
      #shrug { font-size: 30px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene4" data-width="1920" data-height="1080">
      <div id="scene4" class="clip">
        <div id="wordmark">Nexus</div>
        <div class="beam"></div>
        <div id="tagline">Chat with every AI, from one Nexus.</div>
        <div id="addr"><b>nexusos.dpdns.org</b></div>
        <div id="shrug">Get the app &mdash; or don&rsquo;t.</div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#wordmark', { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: 'power3.out' }, 0.3);
      tl.fromTo('#tagline', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.0);
      tl.fromTo('#addr', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.47);
      tl.fromTo('#shrug', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.47);
      tl.to('.beam', { opacity: 0.939, duration: 0.25, ease: 'none' }, 0);
      tl.to('.beam', { opacity: 0.961, duration: 0.25, ease: 'none' }, 0.25);
      tl.to('.beam', { opacity: 0.923, duration: 0.25, ease: 'none' }, 0.5);
      tl.to('.beam', { opacity: 0.922, duration: 0.25, ease: 'none' }, 0.75);
      tl.to('.beam', { opacity: 0.872, duration: 0.25, ease: 'none' }, 1.0);
      tl.to('.beam', { opacity: 0.855, duration: 0.25, ease: 'none' }, 1.25);
      tl.to('.beam', { opacity: 0.972, duration: 0.25, ease: 'none' }, 1.5);
      tl.to('.beam', { opacity: 0.821, duration: 0.25, ease: 'none' }, 1.75);
      tl.to('.beam', { opacity: 0.924, duration: 0.25, ease: 'none' }, 2.0);
      tl.to('.beam', { opacity: 0.784, duration: 0.25, ease: 'none' }, 2.25);
      tl.to('.beam', { opacity: 0.982, duration: 0.25, ease: 'none' }, 2.5);
      tl.to('.beam', { opacity: 0.909, duration: 0.25, ease: 'none' }, 2.75);
      tl.to('.beam', { opacity: 0.991, duration: 0.25, ease: 'none' }, 3.0);
      tl.to('.beam', { opacity: 0.927, duration: 0.25, ease: 'none' }, 3.25);
      tl.to('.beam', { opacity: 0.953, duration: 0.25, ease: 'none' }, 3.5);
      tl.to('.beam', { opacity: 0.929, duration: 0.25, ease: 'none' }, 3.75);
      tl.to('#scene4', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 3.7);
      window.__timelines['scene4'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
