<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus — 3D Architecture</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1a;overflow:hidden;
    font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #c{position:fixed;inset:0}
  .hud{position:fixed;left:20px;top:18px;color:#eaf1ff;pointer-events:none;max-width:min(430px,72vw)}
  .hud h1{margin:0;font-size:27px;font-weight:650;letter-spacing:-0.02em;line-height:1.05}
  .hud p{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:#8fb0e8}
  .hint{position:fixed;left:20px;bottom:14px;color:#8fb0e8;font-size:12.5px}
  .live{position:fixed;right:20px;bottom:14px;font-size:12.5px}
  .live a{color:#67e8f9;text-decoration:none;border-bottom:1px solid #67e8f9}
  ::selection{background:#67e8f9;color:#0a0f1a}
</style>
</head>
<body>
<div id="c"></div>
<div class="hud"><h1>Nexus</h1><p>One AI home for owner and friends: one gate, one app, and a memory that follows the chat across every provider.</p></div>
<div class="hint">Drag to orbit &middot; scroll to zoom</div>
<div class="live"><a href="https://nexusos.dpdns.org">Live: nexusos.dpdns.org</a></div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const CFG = {"bg":659226,"ink":"#eaf1ff","sub":"#8fb0e8","accent":6809849,"gridA":1780557,"gridB":1121331,"gridY":-6.2,"edge":14674431,"link":5074355,"cam":[21,15,26.5],"floor":0,"nodes":[{"id":"users","color":3108845,"title":"USERS","sub":"admin + friends","x":-13,"y":6.4,"z":2,"w":4.6,"h":2.2,"d":3.4},{"id":"caddy","color":8018680,"title":"CADDY · HTTPS","sub":"nexusos.dpdns.org","x":0,"y":6.4,"z":-1,"w":4.6,"h":2.2,"d":3.4},{"id":"core","color":959908,"title":"NEXUS APP","sub":"estate server · :8100","x":0,"y":0.6,"z":0,"w":6.4,"h":3,"d":4.6,"s":1.25},{"id":"chat","color":3718648,"title":"CHAT","sub":"shared memory","x":-10.6,"y":0.4,"z":5.6,"w":4.2,"h":2,"d":3},{"id":"vault","color":16096779,"title":"VAULTS","sub":"encrypted keys per user","x":10.6,"y":0.4,"z":5.6,"w":4.2,"h":2,"d":3},{"id":"intg","color":10980346,"title":"INTEGRATIONS","sub":"Gmail · Zoom · tools","x":10.6,"y":0.4,"z":-5.6,"w":4.2,"h":2,"d":3},{"id":"sync","color":9741240,"title":"GITHUB SYNC","sub":"encrypted friend backup","x":-10.6,"y":0.4,"z":-5.6,"w":4.2,"h":2,"d":3},{"id":"prov","color":2278750,"title":"AI PROVIDERS","sub":"Gemini · Groq · NVIDIA · OpenRouter","x":6.2,"y":-5,"z":1.5,"w":5.6,"h":2,"d":3.4},{"id":"api","color":16478597,"title":"/v1 API","sub":"powers DSRclone copilot","x":-7.2,"y":-5,"z":1.5,"w":4.6,"h":2,"d":3.4}],"edges":[["users","caddy"],["caddy","core"],["core","chat"],["core","vault"],["core","intg"],["core","sync"],["core","prov"],["core","api"]],"yOff":-1.3,"labelScale":1};
const wrap = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.bg);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 300);
camera.position.set(CFG.cam[0], CFG.cam[1], CFG.cam[2]);
if (innerWidth/innerHeight < 1) camera.position.multiplyScalar(Math.min(2.6, innerHeight/innerWidth * 1.12));
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxDistance = 160; controls.minDistance = 9;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 0.6); key.position.set(14, 24, 10); scene.add(key);
const rim = new THREE.DirectionalLight(CFG.accent, 0.5); rim.position.set(-16, 8, -14); scene.add(rim);

const world = new THREE.Group(); world.position.y = CFG.yOff || 0; scene.add(world);

if (CFG.floor) {
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(46, 34),
    new THREE.MeshStandardMaterial({color:CFG.floor, roughness:0.95, metalness:0}));
  plane.rotation.x = -Math.PI/2; plane.position.y = CFG.gridY - 0.02; world.add(plane);
}
const grid = new THREE.GridHelper(CFG.floor ? 46 : 74, CFG.floor ? 23 : 37, CFG.gridA, CFG.gridB);
grid.position.y = CFG.gridY; world.add(grid);

function label(text, sub, scale){
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 176;
  const g = cv.getContext('2d');
  g.textAlign = 'center';
  g.fillStyle = CFG.ink; g.font = '600 45px system-ui, sans-serif';
  g.fillText(text, 320, sub ? 66 : 100);
  if (sub){ g.fillStyle = CFG.sub; g.font = '29px system-ui, sans-serif'; g.fillText(sub, 320, 116); }
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, depthTest:false}));
  sp.renderOrder = 10;
  sp.scale.set(8.4*scale, 2.31*scale, 1);
  return sp;
}

const nodes = {};
function node(n){
  const geo = new THREE.BoxGeometry(n.w, n.h, n.d);
  const mat = new THREE.MeshStandardMaterial({color:n.color, metalness:0.08, roughness:0.5,
    emissive:n.color, emissiveIntensity:0.05});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(n.x, n.y, n.z); world.add(m);
  const eg = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({color:CFG.edge, transparent:true, opacity:0.5}));
  m.add(eg);
  const s = (n.s || 1) * (CFG.labelScale || 1);
  const lb = label(n.title, n.sub, s); lb.position.set(n.x, n.y + n.h/2 + 1.7*s, n.z); world.add(lb);
  nodes[n.id] = new THREE.Vector3(n.x, n.y, n.z);
}
CFG.nodes.forEach(node);

const flows = [];
const lineMat = new THREE.LineBasicMaterial({color:CFG.link, transparent:true, opacity:0.55});
const pulseGeo = new THREE.SphereGeometry(0.17, 10, 10);
const pulseMat = new THREE.MeshBasicMaterial({color:CFG.accent});
CFG.edges.forEach(([a,b]) => {
  const p1 = nodes[a], p2 = nodes[b];
  world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, p2]), lineMat));
  for (let i = 0; i < 2; i++){
    const pm = new THREE.Mesh(pulseGeo, pulseMat);
    world.add(pm);
    flows.push({p1, p2, mesh:pm, t: Math.random(), speed: 0.12 + Math.random()*0.12});
  }
});

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  flows.forEach(f => { if (!reduced) f.t = (f.t + dt * f.speed) % 1; f.mesh.position.lerpVectors(f.p1, f.p2, f.t); });
  controls.update();
  renderer.render(scene, camera);
}
tick();

window.__spin = function(deg){ world.rotation.y += deg * Math.PI/180; };
window.__ready = true;
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
