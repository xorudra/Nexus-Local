<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url(../assets/fonts/sg-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(../assets/fonts/sg-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../assets/fonts/sg-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../assets/fonts/jm-400.woff2) format('woff2'); }
      :root { --ground: #050505; --panel: #0d0d10; --ink: #fafafa; --muted: #a7a7b0; --accent: #38bdf8; --danger: #ff9d97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Space Grotesk', sans-serif; background: var(--ground); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #scene2 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      /* Traveling border beam: crisp conic-gradient ring, NO blur, NO shadow.
         The bright segment travels continuously around the picture border
         (3s per revolution, looping) — visibly different positions at 6s, 8s, 10s. */
      .picframe { --ba: 0deg; width: 1560px; padding: 4px; border-radius: 24px;
        background: conic-gradient(from var(--ba), transparent 0deg, transparent 280deg, #38bdf8 310deg, #ffffff 340deg, #38bdf8 355deg, transparent 360deg); }
      .picframe video { display: block; width: 100%; height: auto; border-radius: 20px; background: #000; }
      /* Failover story as video caption text BELOW the real picture — never
         fake UI inside a mock app. */
      .cap { width: 1560px; display: flex; flex-direction: column; gap: 14px; }
      .trace { font-family: 'JetBrains Mono', monospace; font-size: 32px; line-height: 1.6; }
      .trace .fail { color: var(--danger); }
      .trace .ok { color: var(--accent); }
      .trace .hl { background: rgba(56,189,248,.14); padding: 2px 14px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene2" data-width="1920" data-height="1080" data-duration="7">
      <div id="scene2" class="clip"><div id="dashframe" class="picframe"><video id="chat-video" class="chatvid" data-start="0" data-duration="7" data-media-start="0" muted playsinline preload="auto" src="../assets/vid/chat-clip-raw.mp4"></video></div><div class="cap"><div class="trace"><span id="tracefail" class="fail">&#10005; <s>Claude</s> &middot; limit reached</span><br /><span id="traceok" class="ok hl">&#10003; Gemini continues &mdash; same memory</span></div></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#dashframe', { opacity: 0, y: 24, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.0);
      tl.fromTo('#dashframe', { '--ba': '0deg' }, { '--ba': '360deg', duration: 3.5, ease: 'none', repeat: 1 }, 0.0);
      tl.fromTo('#tracefail', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.5);
      tl.fromTo('#traceok', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.2);
      tl.to('#scene2', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 6.7);
      window.__timelines['scene2'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
