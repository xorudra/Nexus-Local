<!-- Nexus Sidebar -->
<style>:root{color-scheme:dark}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
/* Nexus sidebar — shadcn-style composition (brand header, grouped nav,
   footer, collapsible-to-icons) in the original Purple Gotham theme.
   Desktop >=1100px: pinned rail, content offset. Below: slide-over. */
.nexus-burger{position:fixed;top:14px;left:14px;z-index:1001;background:#141418;border:1px solid rgba(255,255,255,.35);border-radius:8px;width:40px;height:40px;cursor:pointer;color:#f2f2f2;font-size:1.125rem;line-height:1;display:none;align-items:center;justify-content:center}
.nexus-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:block;opacity:0;pointer-events:none;transition:opacity .25s cubic-bezier(.2,.9,.25,1);backdrop-filter:blur(3px) saturate(120%);-webkit-backdrop-filter:blur(3px) saturate(120%)}
@media (prefers-reduced-transparency: reduce){.nexus-overlay{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.78)}}
.nexus-overlay.show{opacity:1;pointer-events:auto}
.nexus-sidebar{position:fixed;top:0;left:0;width:260px;height:100dvh;background:#050505;border-right:1px solid rgba(255,255,255,.16);z-index:1000;display:flex;flex-direction:column;box-sizing:border-box;transition:width .2s cubic-bezier(.2,.9,.25,1),left .25s cubic-bezier(.2,.9,.25,1)}
.nexus-side-head{display:flex;align-items:center;gap:0.5625rem;padding:1rem 0.75rem 0.75rem}
.nexus-brand{display:flex;align-items:center;gap:0.625rem;text-decoration:none;flex:1;min-width:0}
.nexus-brand .bt{color:#fff;font-family:'Space Grotesk',sans-serif;font-size:1.03125rem;letter-spacing:.15em;white-space:nowrap;line-height:1;overflow:hidden;text-overflow:ellipsis}
.nexus-brand .bt em{font-style:normal;color:#f2f2f2}
.nexus-toggle{margin-left:auto;width:30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#8e8e8e;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nexus-toggle:hover{color:#fff;border-color:#f2f2f2}
.nexus-nav{flex:1;overflow-y:auto;padding:0.25rem 0.75rem 0.75rem;scrollbar-width:thin}
.nexus-glabel{font-size:0.65625rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8e8e8e;padding:1rem 0.625rem 0.375rem;white-space:nowrap}
.nexus-sidebar a.nx-item{display:flex;align-items:center;gap:0.6875rem;padding:0.5625rem 0.625rem;border-radius:8px;color:#8e8e8e;text-decoration:none;font-size:0.90625rem;white-space:nowrap;border-left:none}
.nexus-sidebar a.nx-item svg{flex-shrink:0;opacity:.85}
.nexus-sidebar a.nx-item:hover{color:#fff;background:rgba(255,255,255,.07)}
.nexus-sidebar a.nx-item.active{color:#fff;background:rgba(255,255,255,.14)}
.nexus-sidebar a.nx-item.active svg{color:#f2f2f2;opacity:1}
.nexus-foot{border-top:1px solid rgba(255,255,255,.14);padding:0.625rem 0.75rem}
/* Self-defence: some pages style bare button/svg elements globally.
   The sidebar's own geometry is pinned so it renders identically
   on every page. */
.nexus-burger{width:40px!important;height:40px!important;padding:0!important}
.nexus-toggle{width:30px!important;height:30px!important;padding:0!important}
.nexus-toggle svg{width:15px!important;height:15px!important;flex:none}
.nexus-sidebar a.nx-item svg{width:17px!important;height:17px!important;flex:none}
@media (min-width:68.75em){
  body{margin-left:260px;transition:margin-left .2s cubic-bezier(.2,.9,.25,1)}
  html.nx-min body{margin-left:76px}
  html.nx-min .nexus-sidebar{width:76px}
  html.nx-anim .nexus-sidebar{overflow:hidden}
  .nx-drag{position:absolute;top:0;right:-0.3125rem;width:0.625rem;height:100%;cursor:col-resize;z-index:5;touch-action:none}
  .nx-drag:hover,.nx-drag.on{background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
  html.nx-dragging{cursor:col-resize}
  html.nx-dragging body{transition:none!important}
  html.nx-dragging .nexus-sidebar{transition:none}
  html.nx-min .nexus-brand .bt,html.nx-min .nexus-glabel,html.nx-min .nexus-sidebar a.nx-item span{display:none}
  html.nx-min .nexus-side-head{flex-direction:column;padding:0.875rem 0.5rem 0.625rem}
  html.nx-min .nexus-toggle{margin-left:0}
  html.nx-min .nexus-sidebar a.nx-item{justify-content:center;padding:0.625rem 0}
  html.nx-min .nexus-glabel{padding:0.625rem 0 0.125rem;text-align:center}
}
@media (max-width:68.6875em){
  .nexus-sidebar{left:-280px;will-change:transform}
  .nexus-sidebar.open{left:0}
  .nexus-burger{display:flex}
  .nexus-toggle{display:none}
}

/* Apple-feel: instant press feedback (fires on press, not release) */
button,.btn{transition:transform .15s ease-out,background-color .2s,color .2s,border-color .2s}
button:active,.btn:active,[role="button"]:active{transform:scale(.97);transition:transform .1s ease-out}

/* Apple-feel: reduced motion = gentle cross-fades/static, never springs or loops */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
:focus-visible{outline:2px solid #f2f2f2;outline-offset:2px}
@media (prefers-contrast: more){button,input,select,textarea{border-color:rgba(255,255,255,.55)!important}}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (pointer:coarse){input,textarea,select{font-size:1rem}}
.nexus-sidebar{padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain}
@view-transition{navigation:auto}
::view-transition-old(root){animation:vtOut .16s cubic-bezier(.2,.9,.25,1)}
::view-transition-new(root){animation:vtIn .2s cubic-bezier(.2,.9,.25,1)}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}
@media (prefers-reduced-motion: reduce){::view-transition-old(root),::view-transition-new(root){animation:none!important}}
.nexus-sidebar{view-transition-name:nexus-rail}
</style>

<script>
(function(){
  var rail=document.getElementById('nx-rail'),
      overlay=document.getElementById('nx-overlay'),
      burger=document.getElementById('nx-burger'),
      toggle=document.getElementById('nx-toggle');
  // Native haptics in the app (NexusNative bridge), browser fallback.
  function nxBuzz(ms){ try{ if(window.NexusNative && NexusNative.vibrate){ NexusNative.vibrate(ms || 8); return; } if(navigator.vibrate) navigator.vibrate(ms || 8); }catch(e){} }
  // Restore the collapsed state before the page settles.
  try{ if(localStorage.getItem('nexus-rail-min')==='1') document.documentElement.classList.add('nx-min'); }catch(e){}
  // Keep the collapse toggle's expanded state honest for assistive
  // tech: one observer covers clicks, Ctrl+B, drag and the spring.
  function syncToggleExpanded(){ if(toggle) toggle.setAttribute('aria-expanded', document.documentElement.classList.contains('nx-min') ? 'false' : 'true'); }
  syncToggleExpanded();
  if (window.MutationObserver) new MutationObserver(syncToggleExpanded).observe(document.documentElement, {attributes:true, attributeFilter:['class']});
  var _minAnim = null;
  function setMin(min){
    try{ localStorage.setItem('nexus-rail-min',min?'1':'0'); }catch(e){}
    var root = document.documentElement;
    // Desktop: spring the rail width + body margin from the live
    // value (interruptible — toggling mid-flight reverses from where
    // it is). Mobile and reduced-motion keep the instant toggle.
    if (!window.matchMedia('(min-width:68.75em)').matches ||
        window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      root.classList.toggle('nx-min',min); return;
    }
    var from = rail.offsetWidth, to = min ? 76 : 260;
    if (from === to){ root.classList.toggle('nx-min',min); return; }
    if (!min) root.classList.remove('nx-min');
    if (_minAnim) cancelAnimationFrame(_minAnim.raf);
    var x = from, v = 0, last = 0;
    root.classList.add('nx-anim');
    function step(ts){
      var dt = Math.min(0.032, last ? (ts - last) / 1000 : 0.016); last = ts;
      var a = -210 * (x - to) - 27 * v; v += a * dt; x += v * dt;
      rail.style.width = x + 'px';
      document.body.style.marginLeft = x + 'px';
      if (Math.abs(x - to) < 0.5 && Math.abs(v) < 12){
        rail.style.width = ''; document.body.style.marginLeft = '';
        root.classList.remove('nx-anim');
        root.classList.toggle('nx-min', min);
        _minAnim = null; return;
      }
      _minAnim.raf = requestAnimationFrame(step);
    }
    _minAnim = { raf: requestAnimationFrame(step) };
  }
  if(toggle) toggle.addEventListener('click',function(){
    setMin(!document.documentElement.classList.contains('nx-min')); nxBuzz(8);
  });
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){ e.preventDefault();
      setMin(!document.documentElement.classList.contains('nx-min')); nxBuzz(8); }
  });
  // Mobile rail on a spring: starts from its live position, carries
  // velocity, and can be grabbed mid-flight — same model as the
  // dashboard's chats panel. Desktop keeps the class toggle.
  var _rx = null, _rv = 0, _rTarget = null, _rRaf = null, _rLast = 0;
  function _rMobile(){ return window.matchMedia('(max-width:68.6875em)').matches; }
  function _rApply(){
    rail.style.transform = 'translateX(' + _rx + 'px)';
    overlay.style.opacity = Math.min(1, Math.max(0, _rx / 280)).toFixed(3);
  }
  function _rStep(ts){
    if (_rTarget === null){ _rRaf = null; return; }
    var dt = Math.min(0.032, _rLast ? (ts - _rLast) / 1000 : 0.016); _rLast = ts;
    var a = -210 * (_rx - _rTarget) - 27 * _rv;
    _rv += a * dt; _rx += _rv * dt; _rApply();
    if (Math.abs(_rx - _rTarget) < 0.5 && Math.abs(_rv) < 12){
      _rx = _rTarget; _rv = 0; _rApply(); _rTarget = null; _rRaf = null; return;
    }
    _rRaf = requestAnimationFrame(_rStep);
  }
  var _rRM = window.matchMedia('(prefers-reduced-motion: reduce)');
  function _rSpringTo(target, v){
    if (_rRM.matches){ _rx = target; _rv = 0; _rTarget = null; _rApply(); return; }
    if (_rx === null) _rx = rail.classList.contains('open') ? 280 : 0;
    if (typeof v === 'number') _rv = v;
    _rTarget = target; _rLast = 0;
    if (!_rRaf) _rRaf = requestAnimationFrame(_rStep);
  }
  function openRail(){
    rail.classList.add('open'); overlay.classList.add('show');
    if (_rMobile()){ overlay.style.pointerEvents = 'auto'; _rSpringTo(280); }
  }
  function closeRail(){
    rail.classList.remove('open'); overlay.classList.remove('show');
    if (_rMobile()){ overlay.style.pointerEvents = 'none'; _rSpringTo(0); }
  }
  document.addEventListener('keydown',e=>{
    if (e.key === 'Escape' && _rMobile() && rail.classList.contains('nx-open')) _rSet(false);
  });
  // Desktop: drag the rail's right edge to resize it 1:1; on
  // release it springs to mini or full and persists like the toggle.
  var dragH = document.createElement('div');
  dragH.className = 'nx-drag';
  dragH.setAttribute('aria-hidden', 'true');
  rail.appendChild(dragH);
  var _drag = null;
  dragH.addEventListener('pointerdown', e => {
    if (_rMobile() || e.button !== 0) return;
    if (_minAnim){ cancelAnimationFrame(_minAnim.raf); _minAnim = null; document.documentElement.classList.remove('nx-anim'); }
    _drag = { x: e.clientX, w: rail.offsetWidth };
    document.documentElement.classList.add('nx-dragging');
    dragH.classList.add('on');
    try{ dragH.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  dragH.addEventListener('pointermove', e => {
    if (!_drag) return;
    var x = Math.max(76, Math.min(260, _drag.w + (e.clientX - _drag.x)));
    rail.style.width = x + 'px';
    document.body.style.marginLeft = x + 'px';
    document.documentElement.classList.toggle('nx-min', x < 150);
  });
  function _dragEnd(){
    if (!_drag) return;
    var x = rail.offsetWidth; _drag = null;
    document.documentElement.classList.remove('nx-dragging');
    dragH.classList.remove('on');
    nxBuzz(8);
    setMin(x < 168);
  }
  dragH.addEventListener('pointerup', _dragEnd);
  dragH.addEventListener('pointercancel', _dragEnd);
  if(burger) burger.addEventListener('click', openRail);
  if(overlay) overlay.addEventListener('click', closeRail);
  window.addEventListener('resize', function(){
    if (!_rMobile()){ rail.style.transform = ''; overlay.style.opacity = ''; }
  });
  // Drag the open rail shut: engages only once a horizontal pull is
  // clear, so vertical scrolling and taps inside it are untouched.
  (function(){
    var d = null, engaged = false, suppress = false;
    rail.addEventListener('pointerdown', function(e){
      if (!_rMobile() || !rail.classList.contains('open')) return;
      d = { id: e.pointerId, x0: e.clientX, y0: e.clientY, hist: [{x: e.clientX, t: performance.now()}] };
      engaged = false;
    });
    rail.addEventListener('pointermove', function(e){
      if (!d || e.pointerId !== d.id) return;
      var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if (!engaged){
        if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
          engaged = true;
          _rTarget = null; if (_rRaf){ cancelAnimationFrame(_rRaf); _rRaf = null; }
          if (_rx === null) _rx = 280;
          try{ rail.setPointerCapture(e.pointerId); }catch(err){}
        } else return;
      }
      _rx = Math.min(280, Math.max(0, 280 + dx));
      _rApply();
      d.hist.push({x: e.clientX, t: performance.now()});
      if (d.hist.length > 6) d.hist.shift();
    });
    function endD(e){
      if (!d || e.pointerId !== d.id) return;
      var was = engaged, h = d.hist, n = h.length, v = 0;
      if (n > 1){ var dt = (h[n-1].t - h[0].t) / 1000; if (dt > 0) v = (h[n-1].x - h[0].x) / dt; }
      d = null; engaged = false;
      if (!was) return;
      suppress = true;
      setTimeout(function(){ suppress = false; }, 350);
      var projected = _rx + v * 0.499;
      if (projected < 140){ closeRail(); _rSpringTo(0, v); }
      else { openRail(); _rSpringTo(280, v); }
    }
    rail.addEventListener('pointerup', endD);
    rail.addEventListener('pointercancel', endD);
    rail.addEventListener('click', function(e){ if (suppress){ e.stopPropagation(); e.preventDefault(); } }, true);
  })();
  // Active item for the current page (same rule as before).
  var p=location.pathname;
  document.querySelectorAll('.nexus-sidebar a[data-page]').forEach(function(a){
    if((p==='/'&&a.dataset.page==='dashboard')||p==='/'+a.dataset.page){a.classList.add('active');a.setAttribute('aria-current','page');}
  });
  // Role-gated items (same behaviour as before): admins see Update
  // Keys / Admin / API Access; friends see My Keys instead.
  fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list'})})
  .then(function(r){
    if(r.ok){
      ['nav-admin','nav-api','nav-keys','nav-admin-label'].forEach(function(id){
        var el=document.getElementById(id); if(el) el.style.display='';
      });
    } else {
      var m=document.getElementById('nav-mykeys'); if(m) m.style.display='';
    }
  })
  .catch(function(){
    var m=document.getElementById('nav-mykeys'); if(m) m.style.display='';
  });
})();
</script>
