<!-- Nexus Sidebar -->
<style>
.nexus-burger{position:fixed;top:18px;left:18px;z-index:1001;background:#141418;border:1px solid rgba(168,85,247,.35);border-radius:8px;padding:10px 12px;cursor:pointer;color:#A855F7;font-size:20px;line-height:1}
.nexus-sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#0c0c0f;border-right:1px solid rgba(168,85,247,.16);z-index:1000;transition:left .25s ease;padding:70px 0 20px;box-sizing:border-box}
.nexus-sidebar.open{left:0}
.nexus-sidebar a{display:block;padding:14px 24px;color:#9aa3b2;text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nexus-sidebar a:hover{color:#fff;background:rgba(168,85,247,.05)}
.nexus-sidebar a.active{color:#A855F7;border-left-color:#A855F7;background:rgba(168,85,247,.06)}
.nexus-sidebar .nav-title{padding:0 24px 12px;color:#A855F7;font-size:15px;letter-spacing:.28em;font-family:'Bebas Neue',sans-serif}
.nexus-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;display:none}
.nexus-overlay.show{display:block}
</style>
<button class="nexus-burger" onclick="document.querySelector('.nexus-sidebar').classList.add('open');document.querySelector('.nexus-overlay').classList.add('show')">☰</button>
<div class="nexus-overlay" onclick="document.querySelector('.nexus-sidebar').classList.remove('open');this.classList.remove('show')"></div>
<nav class="nexus-sidebar">
<div class="nav-title"><svg viewBox="0 0 100 36" style="width:26px;height:10px;vertical-align:baseline;margin-right:8px"><path d="M0,14 L24,3 L39,9 L44,1 L46.5,7 L50,5 L53.5,7 L56,1 L61,9 L76,3 L100,14 L90,20 L83,16 L75,24 L67,18 L59,28 L54,22 L50,30 L46,22 L41,28 L33,18 L25,24 L17,16 L10,20 Z" fill="#A855F7"/></svg>NEXUS LOCAL</div>
<a href="/" data-page="dashboard">Dashboard</a>
<a href="/connections" data-page="connections">Connections</a>
<a href="/settings" data-page="settings">Update Keys</a>
<a href="#" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login');return false">Logout</a>
</nav>
<script>
(function(){
var p=location.pathname;
document.querySelectorAll('.nexus-sidebar a[data-page]').forEach(function(a){
if((p==='/'&&a.dataset.page==='dashboard')||p==='/'+a.dataset.page)a.classList.add('active');
});
})();
</script>
