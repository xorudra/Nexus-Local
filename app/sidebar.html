<!-- Nexus Sidebar -->
<style>
.nexus-burger{position:fixed;top:18px;left:18px;z-index:1001;background:linear-gradient(#8a8a8a,#6a6a6a);border:2px solid #000;border-radius:0;box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.35);padding:10px 12px;cursor:pointer;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6);font-size:20px;line-height:1}
.nexus-sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#1c1610;border-right:2px solid #000;z-index:1000;transition:left .25s ease;padding:70px 0 20px;box-sizing:border-box}
.nexus-sidebar.open{left:0}
.nexus-sidebar a{display:block;padding:14px 24px;color:#9aa3b2;text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nexus-sidebar a:hover{color:#fff;background:#2a2118}
.nexus-sidebar a.active{color:#7ee83f;border-left-color:#5EB83B;background:#141009}
.nexus-sidebar .nav-title{padding:0 24px 12px;color:#5EB83B;font-size:11px;letter-spacing:.15em;font-family:'Press Start 2P',monospace;text-shadow:1px 1px 0 #000}
.nexus-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;display:none}
.nexus-overlay.show{display:block}
</style>
<button class="nexus-burger" onclick="document.querySelector('.nexus-sidebar').classList.add('open');document.querySelector('.nexus-overlay').classList.add('show')">☰</button>
<div class="nexus-overlay" onclick="document.querySelector('.nexus-sidebar').classList.remove('open');this.classList.remove('show')"></div>
<nav class="nexus-sidebar">
<div class="nav-title">NEXUS LOCAL</div>
<a href="/" data-page="dashboard">Dashboard</a>
<a href="/connections" data-page="connections">Connections</a>
<a href="/settings" data-page="settings">Update Keys</a>
<a href="#" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login');return false">Logout</a>
</nav>
<script>
(function(){
var p=location.pathname;
document.querySelectorAll('.nexus-sidebar a[data-page]').forEach(function(a){
if((p==='/'&&a.dataset.page==='dashboard')||p==='/'+a.dataset.page)a.classList.add('active');
});
})();
</script>
