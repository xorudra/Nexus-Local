}

/* Header */
.header {
    display: flex;
    align-items: center;
    padding: 20px 32px;
    padding-left: 70px;
    background: #11141b;
    border-bottom: 2px solid #000;
    box-shadow: 0 2px 0 #5EB83B;
}

.header h1 {
    font-size: 1.8rem;
    color: #fff;
    margin: 0;
}

.header .wordmark {
    flex: none;
    font-family: 'Press Start 2P', monospace;
    font-size: 1rem;
    color: #dcdcdc;
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 1px;
}

.header .local-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    color: #5EB83B;
    text-shadow: 1px 1px 0 #000;
    background: #0d0a07;
    padding: 4px 8px;
    border: 2px solid #000;
    margin-left: 8px;
    vertical-align: middle;
}

.header .spacer {
    flex: 1;
}

.header button.logout {
    background: none;
    border: none;
    color: #8c8c8c;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
    transition: color 0.2s;
}

.header button.logout:hover {
    color: #fff;
}

/* Hero */
.hero {
    background: #1c1610;
    padding: 32px 48px;
    margin: 20px auto;
    max-width: 1080px;
    border-radius: 0;
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.5);
}

.hero h2 {
    margin: 0 0 12px 0;
    font-size: clamp(15px, 3vw, 20px);
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    text-shadow: 2px 2px 0 #222, 4px 4px 0 #000;
    line-height: 1.6;
}

.hero h2 span.accent {
    color: #5EB83B;
}

/* Provider cards */
.provider-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 0 32px;
    margin: 20px auto;
    max-width: 1080px;
}

.card {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: #11141b;
    border-radius: 20px;
    padding: 28px;
    border: 1px solid #1e2430;
}

.card h3 {
    margin: 0 0 8px 0;
    font-size: 1.2rem;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.card .icon {
    background: linear-gradient(#6cc24a,#4a8f2b);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
}

.card .provider-name {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-size: 17px;
    letter-spacing: 0.05em;
    color: #fff;
    margin: 0 0 4px 0;
}

.card .provider-subtitle {
    font-size: 14px;
    color: #8a93a6;
    margin: 0 0 12px 0;
}

.pill {
    display: inline-block;
    background: #0cff6a;
    color: #111;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 0.75rem;
    vertical-align: middle;
    margin-top: 4px;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.pill.missing {
    background: #ff4d4d;
    color: #111;
}

/* Usage rows */
.usage {
    font-size: 0.875rem;
    color: #aaa;
    margin: 4px 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.bar {
    background: #333;
    height: 6px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
}

.bar > div {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #6cc24a, #4a8f2b);
}

.bar.hot > div {
    background: linear-gradient(90deg, #ff4d4d, #ff004d);
}

/* Usage trend sparklines */
.spark {
    display: block;
    width: 100%;
    max-width: 220px;
    height: 36px;
    margin: 8px 0 4px 0;
}

.spark .spark-line {
    fill: none;
    stroke: #4a9eff;
    stroke-width: 1.5;
}

.spark .spark-area {
    fill: rgba(74, 158, 255, 0.12);
    stroke: none;
}

.spark .spark-grid {
    stroke: #1e2430;
    stroke-width: 1;
}

.trend-today {
    font-size: 0.8rem;
    color: #dde;
    margin: 2px 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.trend-limit {
    font-size: 0.72rem;
    color: #6b7280;
    margin: 2px 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

/* Composer card */
.composer {
    background: #11141b;
    border-radius: 12px;
    padding: 20px;
    margin: 20px auto;
    max-width: 1080px;
    border: 1px solid #1e2430;
}

.composer h2 {
    margin: 0 0 12px 0;
    font-size: 14px;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    text-shadow: 2px 2px 0 #000;
}

.composer h2 span.accent {
    color: #5EB83B;
}

.composer .form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.composer label {
    flex: 1 1 120px;
    font-size: 0.9rem;
    color: #aaa;
    align-self: center;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.composer input, .composer select, .composer textarea {
    flex: 2 1 200px;
    padding: 8px 10px;
    background: #0d0a07;
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,.6);
    border-radius: 0;
    color: #eee;
    font-size: 1em;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.composer button#composer-send {
    flex: 1 1 100%;
    background: linear-gradient(#6cc24a,#4a8f2b);
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,.55);
    border: 2px solid #000;
    border-radius: 0;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.4);
    padding: 16px 32px;
    margin-top: 12px;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
}

.composer button#composer-send:hover {
    filter: brightness(1.1);
}
.composer button#composer-send:active {
    transform: translateY(1px);
}

.composer pre {
    background: #0d1117;
    border-radius: 12px;
    padding: 18px;
    margin-top: 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 500px;
    overflow-y: auto;
    border: 2px solid #000;
    font-size: 14px;
    line-height: 1.6;
    display: none;
}
.composer pre.has-content {
    display: block;
    animation: fadeIn .3s;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
}

/* Refresh button */
.refresh {
    display: block;
    margin: 20px auto;
    padding: 12px 24px;
    background: linear-gradient(#a6a6a6,#707070);
    color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,.6);
    border: 2px solid #000;
    border-radius: 0;
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.4);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.refresh:hover {
    filter: brightness(1.1);
}

/* Typography */
::placeholder {
    color: #555;
}

/* Eyebrow labels */
.eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: #5EB83B;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    text-transform: uppercase;
}

/* Mobile */
@media (max-width: 640px) {
    .header {
        padding: 16px;
    }

    .hero, .provider-grid, .composer {
        margin: 16px;
        padding: 24px;
    }

    .hero h2 {
        font-size: 2rem;
    }

    .composer button {
        width: 100%;
        padding: 16px;
    }

    .card {
        padding: 24px;
    }
}
</style>
</head>

const combinedUsage = document.getElementById('combined-usage');
const logoutBtn = document.getElementById('logout-btn');
const composerProviders = document.getElementById('composer-provider');
const composerSend = document.getElementById('composer-send');
const composerReply = document.getElementById('composer-reply');

async function fetchQuotas() {
    try {
        const r = await fetch('/api/quotas');
        if (r.status === 401) {
            location.href = '/login';
            return;
        }
        const data = await r.json();
        renderUsage(data);
    } catch (e) {
        console.error(e);
        providerGrid.innerHTML = '<p style="color: #ff8">Failed to load quotas</p>';
    }
}

function friendlyName(provider) {
    if (provider.startsWith('relay_')) {
        const base = provider.replace('relay_', '');
        return 'Relay: ' + base.charAt(0).toUpperCase() + base.slice(1);
    }
    if (provider === 'freellmapi') return 'FreeLLMAPI: Gateway';
    return 'FreeLLMAPI: ' + provider.charAt(0).toUpperCase() + provider.slice(1);
}

async function populateComposer() {
    try {
        const r = await fetch('/api/quotas');
        const data = await r.json();
        composerProviders.innerHTML = '';
        data.providers.forEach(p => {
            if (p.key_configured) {
                const opt = document.createElement('option');
                opt.value = p.provider;
                opt.textContent = friendlyName(p.provider);
                composerProviders.appendChild(opt);
            }
        });
        // Load models for first provider
        if (composerProviders.value) loadModels(composerProviders.value);
    } catch (e) {
        console.error('Composer init', e);
    }
}

async function loadModels(provider) {
    const modelInput = document.getElementById('composer-model');
    try {
        const r = await fetch('/api/models?provider=' + encodeURIComponent(provider));
        const data = await r.json();
        const models = data.models || [];
        // Replace text input with datalist for autocomplete
        let dl = document.getElementById('model-datalist');
        if (!dl) {
            dl = document.createElement('datalist');
            dl.id = 'model-datalist';
            document.body.appendChild(dl);
            modelInput.setAttribute('list', 'model-datalist');
        }
        dl.innerHTML = '';
        models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            dl.appendChild(opt);
        });
    } catch (e) {
        console.error('Model load', e);
    }
}

function barRow(label, used, limit) {
    if (limit == null) return `<div class="usage">${label}: ${used} – <i class="nocap">No published cap</i></div>`;
    const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
    const hot = pct >= 90 ? ' hot' : '';
    return `<div class="usage">${label}: ${used}/${limit}</div><div class="bar${hot}"><div style="width: ${pct}%"></div></div>`;
}

function sparkline(data, label) {
    const w = 220, h = 36, pad = 3;
    const max = Math.max.apply(null, data.concat([1]));
    const min = Math.min.apply(null, data.concat([0]));
    const range = (max - min) || 1;
    const stepX = (w - pad * 2) / (data.length - 1);
    const pts = data.map(function(v, i) {
        const x = (pad + i * stepX).toFixed(1);
        const y = (h - pad - ((v - min) / range) * (h - pad * 2)).toFixed(1);
        return x + ',' + y;
    });
    const line = pts.join(' ');
    const area = pad + ',0 ' + line + ' ' + (w - pad).toFixed(1) + ',0';
    const gridY = (h / 2).toFixed(1);
    const esc = (label || '').replace(/"/g, '&quot;');
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc + '">'
        + '<line class="spark-grid" x1="' + pad + '" y1="' + gridY + '" x2="' + (w - pad) + '" y2="' + gridY + '"/>'
        + '<polygon class="spark-area" points="' + area + '"/>'
        + '<polyline class="spark-line" points="' + line + '"/>'
        + '</svg>';
}

function renderUsage(data) {
    const providers = data.providers || [];
    if (providerGrid) providerGrid.innerHTML = '';
    if (combinedUsage) combinedUsage.innerHTML = '';
    // Combined 7-day history (d0 = today at index 6)
    const ch = data.history || {requests: [0,0,0,0,0,0,0], tokens: [0,0,0,0,0,0,0]};
    const totReqToday = ch.requests[6] || 0;
    const totTokToday = ch.tokens[6] || 0;
    combinedUsage.innerHTML = '<h3>Combined Usage</h3>'
        + '<div class="usage">Resets vary by provider — see individual cards below</div>'
        + sparkline(ch.requests, 'Combined 7-day requests')
        + '<div class="trend-today">' + totReqToday + ' requests · ' + totTokToday.toLocaleString() + ' tokens today</div>';
    providers.forEach(function(p) {
        const div = document.createElement('div');
        div.className = 'card';
        const h = p.history || {requests: [0,0,0,0,0,0,0], tokens: [0,0,0,0,0,0,0]};
        const reqToday = h.requests[6] || 0;
        const tokToday = h.tokens[6] || 0;
        // Only show a limit where one is really published — never invent.
        let limitText = '';
        const drl = p.limits && p.limits.daily_requests && p.limits.daily_requests.limit;
        if (typeof drl === 'number') {
            limitText = '<div class="trend-limit">Limit: ' + drl + '/day</div>';
        }
        div.innerHTML = '<div class="icon">◆</div><div>'
            + '<h3 class="provider-name">' + escapeHtml(p.display_name || p.provider) + '</h3>'
            + '<div class="usage">Key: <span class="pill' + (p.key_configured ? '' : ' missing') + '">'
            + (p.key_configured ? '✓' : '✗') + '</span></div>'
            + '<div class="usage">Reset: ' + escapeHtml(p.reset || '') + '</div>'
            + sparkline(h.requests, (p.display_name || p.provider) + ' 7-day requests')
            + '<div class="trend-today">' + reqToday + ' requests · ' + tokToday.toLocaleString() + ' tokens today</div>'
            + limitText
            + '</div>';
        if (providerGrid) providerGrid.appendChild(div);
    });
}

function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

populateComposer();
fetchQuotas();
setInterval(fetchQuotas, 10000);

document.getElementById("refresh-quotas").addEventListener("click", async () => {
    const r = await fetch("/api/refresh", { method: "POST" });
    if (r.status === 401) {
        location.href = "/login";
        return;
    }
    fetchQuotas();
});

logoutBtn.addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/login');
});


// Attachment handling with + menu
let attachedImage = null;
let attachedFile = null;
let attachedLink = null;
const attachPlus = document.getElementById('attach-plus');
const attachMenu = document.getElementById('attach-menu');
const attachInput = document.getElementById('attach-input');
const cameraInput = document.getElementById('camera-input');
const attachPreview = document.getElementById('attach-preview');

if (attachPlus && attachMenu) {
    attachPlus.addEventListener('click', (e) => {
        e.stopPropagation();
        attachMenu.style.display = attachMenu.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', (e) => {
        if (!attachMenu.contains(e.target)) attachMenu.style.display = 'none';
    });
    // Hover effect for options
    document.querySelectorAll('.attach-opt').forEach(btn => {
        btn.addEventListener('mouseenter', () => btn.style.background = '#1e2430');
        btn.addEventListener('mouseleave', () => btn.style.background = 'none');
        btn.addEventListener('click', () => {
            attachMenu.style.display = 'none';
            const type = btn.dataset.type;
            if (type === 'camera') cameraInput.click();
            else if (type === 'link') {
                const url = prompt('Paste image or video URL:');
                if (url) {
                    attachedLink = url;
                    showPreview('link', url);
                }
            }
            else {
                attachInput.dataset.type = type;
                attachInput.click();
            }
        });
    });
}

function showPreview(type, src, name) {
    let previewHtml = '';
    if (type === 'image' || type === 'camera' || type === 'photos') {
        previewHtml = '<img src="' + src + '" style="max-width:200px;border-radius:8px">';
    } else if (type === 'videos') {
        previewHtml = '<video src="' + src + '" style="max-width:200px;border-radius:8px" controls></video>';
    } else if (type === 'files') {
        previewHtml = '<div style="background:#1e2430;padding:12px;border-radius:8px">📄 ' + (name || 'File') + '</div>';
    } else if (type === 'link') {
        previewHtml = '<div style="background:#1e2430;padding:12px;border-radius:8px">🔗 ' + src.substring(0,50) + '</div>';
    }
    attachPreview.innerHTML = previewHtml
        + '<button type="button" onclick="clearAttachment()" style="margin-left:8px;background:#ef4444;border:0;border-radius:8px;color:#fff;padding:8px 12px;cursor:pointer">✕</button>';
}

function handleFile(file, type) {
    if (!file) return;
    const maxSizes = { camera: 8, photos: 8, videos: 20, files: 10 };
    const maxMB = maxSizes[type] || 8;
    if (file.size > maxMB * 1024 * 1024) {
        alert('File too large (max ' + maxMB + 'MB)');
        return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        if (type === 'camera' || type === 'photos' || file.type.startsWith('image/')) {
            attachedImage = dataUrl;
            attachedFile = null;
            showPreview('image', dataUrl);
        } else if (type === 'videos' || file.type.startsWith('video/')) {
            attachedFile = { name: file.name, data: dataUrl, type: file.type };
            attachedImage = null;
            showPreview('videos', dataUrl);
        } else {
            // Document file - read as text if possible
            if (file.type.startsWith('text/') || file.name.match(/\.(txt|md|csv|json|log)$/i)) {
                const textReader = new FileReader();
                textReader.onload = (tev) => {
                    attachedFile = { name: file.name, text: tev.target.result, type: file.type };
                    showPreview('files', null, file.name);
                };
                textReader.readAsText(file);
            } else {
                attachedFile = { name: file.name, data: dataUrl, type: file.type };
                showPreview('files', null, file.name);
            }
            attachedImage = null;
        }
    };
    reader.readAsDataURL(file);
}

if (attachInput) {
    attachInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0], attachInput.dataset.type || 'photos');
    });
}
if (cameraInput) {
    cameraInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0], 'camera');
    });
}

function clearAttachment() {
    attachedImage = null;
    attachedFile = null;
    attachedLink = null;
    if (attachInput) attachInput.value = '';
    if (cameraInput) cameraInput.value = '';
    if (attachPreview) attachPreview.innerHTML = '';
}

composerSend.addEventListener('click', async () => {
    const provider = composerProviders.value;
    const model = document.getElementById('composer-model').value;
    const msg = document.getElementById('composer-message').value;
    if (!provider || !model || !msg) {
        composerReply.classList.add('has-content'); composerReply.textContent = 'Please select a provider, model, and enter a message';
        return;
    }
    composerSend.disabled = true;
    composerSend.textContent = 'Sending…';
    composerReply.classList.add('has-content');
    composerReply.textContent = 'Thinking…';
    try {
        const payload = { provider, model, message: msg };
        if (attachedImage) payload.image = attachedImage;
        if (attachedFile) payload.file = attachedFile;
        if (attachedLink) payload.link = attachedLink;
        const r = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const j = await r.json();
        composerReply.textContent = j.error ? j.error : j.reply;
    } catch (e) {
        composerReply.textContent = 'Error ' + e.message;
    } finally {
        composerSend.disabled = false;
        composerSend.textContent = 'Send';
        clearAttachment();
    }
});
</script>
</body>
