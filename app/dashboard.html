<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Nexus Dashboard</title>
<style>
/* Global */
body {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    background: #0a0c11;
    color: #dde;
    width: 100%;
    overflow-x: hidden;
    background-image: linear-gradient(#1e2430 1px, transparent 1px),
        linear-gradient(90deg, #1e2430 1px, transparent 1px);
    background-size: 20px 20px;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    padding: 20px 32px;
    padding-left: 70px;
    background: #11141b;
    border-bottom: 1px solid #1e2430;
}

.header h1 {
    font-size: 1.8rem;
    color: #fff;
    margin: 0;
}

.header .wordmark {
    flex: none;
    font-size: 1.6rem;
    color: #3b82f6;
    font-weight: 600;
    letter-spacing: 1px;
}

.header .local-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: #9aa3b2;
    background: #1e2430;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
}

.header .spacer {
    flex: 1;
}

.header button.logout {
    background: none;
    border: none;
    color: #8c8c8c;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
    transition: color 0.2s;
}

.header button.logout:hover {
    color: #fff;
}

/* Hero */
.hero {
    background: #11141b;
    padding: 32px 48px;
    margin: 20px auto;
    max-width: 1080px;
    border-radius: 12px;
    border: 1px solid #1e2430;
}

.hero h2 {
    margin: 0 0 12px 0;
    font-size: clamp(2rem, 5vw, 3rem);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
}

.hero h2 span.accent {
    color: #3b82f6;
}

/* Provider cards */
.provider-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 0 32px;
    margin: 20px auto;
    max-width: 1080px;
}

.card {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: #11141b;
    border-radius: 20px;
    padding: 28px;
    border: 1px solid #1e2430;
}

.card h3 {
    margin: 0 0 8px 0;
    font-size: 1.2rem;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.card .icon {
    background: #3b82f6;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
}

.card .provider-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    letter-spacing: 0.05em;
    color: #fff;
    margin: 0 0 4px 0;
}

.card .provider-subtitle {
    font-size: 14px;
    color: #8a93a6;
    margin: 0 0 12px 0;
}

.pill {
    display: inline-block;
    background: #0cff6a;
    color: #111;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 0.75rem;
    vertical-align: middle;
    margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
}

.pill.missing {
    background: #ff4d4d;
    color: #111;
}

/* Usage rows */
.usage {
    font-size: 0.875rem;
    color: #aaa;
    margin: 4px 0;
    font-family: 'IBM Plex Mono', monospace;
}

.bar {
    background: #333;
    height: 6px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
}

.bar > div {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #3b82f6, #06d);
}

.bar.hot > div {
    background: linear-gradient(90deg, #ff4d4d, #ff004d);
}

/* Usage trend sparklines */
.spark {
    display: block;
    width: 100%;
    max-width: 220px;
    height: 36px;
    margin: 8px 0 4px 0;
}

.spark .spark-line {
    fill: none;
    stroke: #4a9eff;
    stroke-width: 1.5;
}

.spark .spark-area {
    fill: rgba(74, 158, 255, 0.12);
    stroke: none;
}

.spark .spark-grid {
    stroke: #1e2430;
    stroke-width: 1;
}

.trend-today {
    font-size: 0.8rem;
    color: #dde;
    margin: 2px 0;
    font-family: 'IBM Plex Mono', monospace;
}

.trend-limit {
    font-size: 0.72rem;
    color: #6b7280;
    margin: 2px 0;
    font-family: 'IBM Plex Mono', monospace;
}

/* Composer card */
.composer {
    background: #11141b;
    border-radius: 12px;
    padding: 20px;
    margin: 20px auto;
    max-width: 1080px;
    border: 1px solid #1e2430;
}

.composer h2 {
    margin: 0 0 12px 0;
    font-size: 1.5rem;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.composer h2 span.accent {
    color: #3b82f6;
}

.composer .form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.composer label {
    flex: 1 1 120px;
    font-size: 0.9rem;
    color: #aaa;
    align-self: center;
    font-family: 'IBM Plex Mono', monospace;
}

.composer input, .composer select, .composer textarea {
    flex: 2 1 200px;
    padding: 8px 10px;
    background: #1e2430;
    border: 1px solid #333;
    border-radius: 6px;
    color: #eee;
    font-size: 1em;
    font-family: 'IBM Plex Mono', monospace;
}

.composer button {
    flex: 1 1 100%;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 32px;
    margin-top: 12px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.composer button:hover {
    background: #2563eb;
}

.composer pre {
    background: #1e2430;
    border-radius: 6px;
    padding: 12px;
    margin-top: 12px;
    color: #cce;
    font-family: 'IBM Plex Mono', monospace;
}

/* Refresh button */
.refresh {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.refresh:hover {
    background: #2563eb;
}

/* Typography */
::placeholder {
    color: #555;
}

/* Eyebrow labels */
.eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #3b82f6;
    letter-spacing: 0.35em;
    margin-bottom: 8px;
    text-transform: uppercase;
}

/* Mobile */
@media (max-width: 640px) {
    .header {
        padding: 16px;
    }

    .hero, .provider-grid, .composer {
        margin: 16px;
        padding: 24px;
    }

    .hero h2 {
        font-size: 2rem;
    }

    .composer button {
        width: 100%;
        padding: 16px;
    }

    .card {
        padding: 24px;
    }
}
</style>
</head>
<body>
<!-- Nexus Sidebar -->
<style>
.nexus-burger{position:fixed;top:18px;left:18px;z-index:1001;background:#11141b;border:1px solid #1e2430;border-radius:10px;padding:10px 12px;cursor:pointer;color:#e6e9f0;font-size:20px;line-height:1}
.nexus-sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#11141b;border-right:1px solid #1e2430;z-index:1000;transition:left .25s ease;padding:70px 0 20px;box-sizing:border-box}
.nexus-sidebar.open{left:0}
.nexus-sidebar a{display:block;padding:14px 24px;color:#9aa3b2;text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nexus-sidebar a:hover{color:#e6e9f0;background:#0f1622}
.nexus-sidebar a.active{color:#3b82f6;border-left-color:#3b82f6;background:#0f1622}
.nexus-sidebar .nav-title{padding:0 24px 12px;color:#3b82f6;font-size:12px;letter-spacing:.3em;font-family:monospace}
.nexus-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;display:none}
.nexus-overlay.show{display:block}
</style>
<button class="nexus-burger" onclick="document.querySelector('.nexus-sidebar').classList.add('open');document.querySelector('.nexus-overlay').classList.add('show')">☰</button>
<div class="nexus-overlay" onclick="document.querySelector('.nexus-sidebar').classList.remove('open');this.classList.remove('show')"></div>
<nav class="nexus-sidebar">
<div class="nav-title">NEXUS LOCAL</div>
<a href="/" data-page="dashboard">Dashboard</a>
<a href="/connections" data-page="connections">Connections</a>
<a href="/settings" data-page="settings">Settings</a>
<a href="#" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login');return false">Logout</a>
</nav>
<script>
(function(){
var p=location.pathname;
document.querySelectorAll('.nexus-sidebar a[data-page]').forEach(function(a){
if((p==='/'&&a.dataset.page==='dashboard')||p==='/'+a.dataset.page)a.classList.add('active');
});
})();
</script>

<div class="header">
    <span class="wordmark">Nexus<span class="local-tag">LOCAL</span></span>
    <span class="spacer"></span>
    <button class="logout" id="logout-btn">Logout</button>
</div>

<div class="hero">
    <div class="eyebrow">USAGE OVERVIEW</div>
    <h2>Your providers, <span class="accent">actually</span> under control</h2>
    <div id="combined-usage"></div>
</div>

<!-- Providers moved to /connections -->

<div class="composer" id="composer-card">
    <div class="eyebrow">TASK COMPOSER</div>
    <h2>Build and <span class="accent">send</span> your tasks</h2>
    <div class="form">
        <div>
            <label for="composer-provider">Provider</label>
            <select id="composer-provider" onchange="loadModels(this.value)"></select>
        </div>
        <div>
            <label for="composer-model">Model</label>
            <input type="text" id="composer-model" placeholder="e.g. llama-3.1-8b-instant">
        </div>
        <div style="flex: 1 1 100%">
            <div style="margin:12px 0">
<button type="button" id="attach-btn" style="background:#1e2430;border:1px solid #2a3342;border-radius:10px;color:#e6e9f0;padding:10px 16px;cursor:pointer;font-size:14px">📎 Attach Image</button>
<input type="file" id="attach-input" accept="image/jpeg,image/png,image/webp" style="display:none">
<div id="attach-preview" style="margin-top:8px"></div>
</div>
<label for="composer-message">Message</label>
            <textarea id="composer-message" rows="4"></textarea>
        </div>
    </div>
    <button id="composer-send">Send</button>
    <pre id="composer-reply"></pre>
</div>

<button class="refresh" id="refresh-quotas">Refresh</button>

<script>
const providerGrid = document.getElementById('provider-grid');
const combinedUsage = document.getElementById('combined-usage');
const logoutBtn = document.getElementById('logout-btn');
const composerProviders = document.getElementById('composer-provider');
const composerSend = document.getElementById('composer-send');
const composerReply = document.getElementById('composer-reply');

async function fetchQuotas() {
    try {
        const r = await fetch('/api/quotas');
        if (r.status === 401) {
            location.href = '/login';
            return;
        }
        const data = await r.json();
        renderUsage(data);
    } catch (e) {
        console.error(e);
        providerGrid.innerHTML = '<p style="color: #ff8">Failed to load quotas</p>';
    }
}

function friendlyName(provider) {
    if (provider.startsWith('relay_')) {
        const base = provider.replace('relay_', '');
        return 'Relay: ' + base.charAt(0).toUpperCase() + base.slice(1);
    }
    if (provider === 'freellmapi') return 'FreeLLMAPI: Gateway';
    return 'FreeLLMAPI: ' + provider.charAt(0).toUpperCase() + provider.slice(1);
}

async function populateComposer() {
    try {
        const r = await fetch('/api/quotas');
        const data = await r.json();
        composerProviders.innerHTML = '';
        data.providers.forEach(p => {
            if (p.key_configured) {
                const opt = document.createElement('option');
                opt.value = p.provider;
                opt.textContent = friendlyName(p.provider);
                composerProviders.appendChild(opt);
            }
        });
        // Load models for first provider
        if (composerProviders.value) loadModels(composerProviders.value);
    } catch (e) {
        console.error('Composer init', e);
    }
}

async function loadModels(provider) {
    const modelInput = document.getElementById('composer-model');
    try {
        const r = await fetch('/api/models?provider=' + encodeURIComponent(provider));
        const data = await r.json();
        const models = data.models || [];
        // Replace text input with datalist for autocomplete
        let dl = document.getElementById('model-datalist');
        if (!dl) {
            dl = document.createElement('datalist');
            dl.id = 'model-datalist';
            document.body.appendChild(dl);
            modelInput.setAttribute('list', 'model-datalist');
        }
        dl.innerHTML = '';
        models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            dl.appendChild(opt);
        });
    } catch (e) {
        console.error('Model load', e);
    }
}

function barRow(label, used, limit) {
    if (limit == null) return `<div class="usage">${label}: ${used} – <i class="nocap">No published cap</i></div>`;
    const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
    const hot = pct >= 90 ? ' hot' : '';
    return `<div class="usage">${label}: ${used}/${limit}</div><div class="bar${hot}"><div style="width: ${pct}%"></div></div>`;
}

function sparkline(data, label) {
    const w = 220, h = 36, pad = 3;
    const max = Math.max.apply(null, data.concat([1]));
    const min = Math.min.apply(null, data.concat([0]));
    const range = (max - min) || 1;
    const stepX = (w - pad * 2) / (data.length - 1);
    const pts = data.map(function(v, i) {
        const x = (pad + i * stepX).toFixed(1);
        const y = (h - pad - ((v - min) / range) * (h - pad * 2)).toFixed(1);
        return x + ',' + y;
    });
    const line = pts.join(' ');
    const area = pad + ',0 ' + line + ' ' + (w - pad).toFixed(1) + ',0';
    const gridY = (h / 2).toFixed(1);
    const esc = (label || '').replace(/"/g, '&quot;');
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc + '">'
        + '<line class="spark-grid" x1="' + pad + '" y1="' + gridY + '" x2="' + (w - pad) + '" y2="' + gridY + '"/>'
        + '<polygon class="spark-area" points="' + area + '"/>'
        + '<polyline class="spark-line" points="' + line + '"/>'
        + '</svg>';
}

function renderUsage(data) {
    const providers = data.providers || [];
    if (providerGrid) providerGrid.innerHTML = '';
    if (combinedUsage) combinedUsage.innerHTML = '';
    // Combined 7-day history (d0 = today at index 6)
    const ch = data.history || {requests: [0,0,0,0,0,0,0], tokens: [0,0,0,0,0,0,0]};
    const totReqToday = ch.requests[6] || 0;
    const totTokToday = ch.tokens[6] || 0;
    combinedUsage.innerHTML = '<h3>Combined Usage</h3>'
        + '<div class="usage">Resets vary by provider — see individual cards below</div>'
        + sparkline(ch.requests, 'Combined 7-day requests')
        + '<div class="trend-today">' + totReqToday + ' requests · ' + totTokToday.toLocaleString() + ' tokens today</div>';
    providers.forEach(function(p) {
        const div = document.createElement('div');
        div.className = 'card';
        const h = p.history || {requests: [0,0,0,0,0,0,0], tokens: [0,0,0,0,0,0,0]};
        const reqToday = h.requests[6] || 0;
        const tokToday = h.tokens[6] || 0;
        // Only show a limit where one is really published — never invent.
        let limitText = '';
        const drl = p.limits && p.limits.daily_requests && p.limits.daily_requests.limit;
        if (typeof drl === 'number') {
            limitText = '<div class="trend-limit">Limit: ' + drl + '/day</div>';
        }
        div.innerHTML = '<div class="icon">◆</div><div>'
            + '<h3 class="provider-name">' + escapeHtml(p.display_name || p.provider) + '</h3>'
            + '<div class="usage">Key: <span class="pill' + (p.key_configured ? '' : ' missing') + '">'
            + (p.key_configured ? '✓' : '✗') + '</span></div>'
            + '<div class="usage">Reset: ' + escapeHtml(p.reset || '') + '</div>'
            + sparkline(h.requests, (p.display_name || p.provider) + ' 7-day requests')
            + '<div class="trend-today">' + reqToday + ' requests · ' + tokToday.toLocaleString() + ' tokens today</div>'
            + limitText
            + '</div>';
        if (providerGrid) providerGrid.appendChild(div);
    });
}

function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

populateComposer();
fetchQuotas();
setInterval(fetchQuotas, 10000);

document.getElementById("refresh-quotas").addEventListener("click", async () => {
    const r = await fetch("/api/refresh", { method: "POST" });
    if (r.status === 401) {
        location.href = "/login";
        return;
    }
    fetchQuotas();
});

logoutBtn.addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/login');
});


// Attachment handling
let attachedImage = null;
const attachBtn = document.getElementById('attach-btn');
const attachInput = document.getElementById('attach-input');
const attachPreview = document.getElementById('attach-preview');
if (attachBtn && attachInput) {
    attachBtn.addEventListener('click', () => attachInput.click());
    attachInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
            alert('Image too large (max 8MB)');
            return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            attachedImage = ev.target.result; // data URI
            attachPreview.innerHTML = '<img src="' + attachedImage + '" style="max-width:200px;border-radius:8px">'
                + '<button type="button" onclick="clearAttachment()" style="margin-left:8px;background:#ef4444;border:0;border-radius:8px;color:#fff;padding:8px 12px;cursor:pointer">✕</button>';
        };
        reader.readAsDataURL(file);
    });
}
function clearAttachment() {
    attachedImage = null;
    attachInput.value = '';
    attachPreview.innerHTML = '';
}

composerSend.addEventListener('click', async () => {
    const provider = composerProviders.value;
    const model = document.getElementById('composer-model').value;
    const msg = document.getElementById('composer-message').value;
    if (!provider || !model || !msg) {
        composerReply.textContent = 'Provider, model, & message required';
        return;
    }
    composerSend.disabled = true;
    composerReply.textContent = '…';
    try {
        const payload = { provider, model, message: msg };
        if (attachedImage) payload.image = attachedImage;
        const r = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const j = await r.json();
        composerReply.textContent = j.error ? j.error : j.reply;
    } catch (e) {
        composerReply.textContent = 'Error ' + e.message;
    } finally {
        composerSend.disabled = false;
    clearAttachment();
    }
});
</script>
</body>
</html>
