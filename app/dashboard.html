<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Nexus Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap');
/* Global */
body {
    margin: 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background-color: #050507;
    background-image: radial-gradient(ellipse 90% 45% at 50% -5%, rgba(255,213,0,.07), transparent 70%);
    color: #dde;
    width: 100%;
    overflow-x: hidden;
    background-color: #050507;
    background-image: radial-gradient(ellipse 90% 45% at 50% -5%, rgba(255,213,0,.07), transparent 70%);
}

/* Header */
.header {
    animation: fadeDown .6s cubic-bezier(.2,.7,.3,1) both;
    display: flex;
    align-items: center;
    padding: 20px 32px;
    padding-left: 70px;
    background: #11141b;
    border-bottom: 1px solid rgba(255,213,0,.18);
    box-shadow: 0 1px 0 rgba(0,0,0,.8);
}

.header h1 {
    font-size: 1.8rem;
    color: #fff;
    margin: 0;
}

.header .wordmark {
    flex: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.7rem;
    letter-spacing: .12em;
    background: linear-gradient(#ffffff,#a8a8b0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

.header .local-tag {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.6rem;
    letter-spacing: .3em;
    color: #0a0a0a;
    background: linear-gradient(#FFE45C,#F5B800);
    padding: 4px 8px 4px 11px;
    border-radius: 4px;
    margin-left: 10px;
    vertical-align: middle;
}

.header .spacer {
    flex: 1;
}

.header button.logout {
    background: none;
    border: none;
    color: #8c8c8c;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
    transition: color 0.2s;
}

.header button.logout:hover {
    color: #fff;
}

/* Hero */
.hero {
    position: relative;
    overflow: hidden;
    animation: fadeUp .7s cubic-bezier(.2,.7,.3,1) both;
    background: #0d0d11;
    padding: 32px 48px;
    margin: 20px auto;
    max-width: 1080px;
    border-radius: 14px;
    border: 1px solid rgba(255,213,0,.14);
    box-shadow: 0 16px 48px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
}

.hero h2 {
    margin: 0 0 12px 0;
    font-size: clamp(28px, 5vw, 40px);
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: .06em;
    line-height: 1.25;
}

.hero::after{content:"";position:absolute;right:-46px;top:50%;width:380px;height:137px;
background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%2036%27%3E%3Cpath%20d%3D%27M0%2C14%20L24%2C3%20L39%2C9%20L44%2C1%20L46.5%2C7%20L50%2C5%20L53.5%2C7%20L56%2C1%20L61%2C9%20L76%2C3%20L100%2C14%20L90%2C20%20L83%2C16%20L75%2C24%20L67%2C18%20L59%2C28%20L54%2C22%20L50%2C30%20L46%2C22%20L41%2C28%20L33%2C18%20L25%2C24%20L17%2C16%20L10%2C20%20Z%27%20fill%3D%27%23FFD500%27/%3E%3C/svg%3E") no-repeat center/contain;opacity:.06;pointer-events:none;animation:batDrift 11s ease-in-out infinite}
.hero h2 span.accent {
    color: #FFD500;
}

/* Provider cards */
.provider-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 0 32px;
    margin: 20px auto;
    max-width: 1080px;
}

.card {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: #11141b;
    border-radius: 20px;
    padding: 28px;
    border: 1px solid #1e2430;
}

.card h3 {
    margin: 0 0 8px 0;
    font-size: 1.2rem;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.card .icon {
    background: linear-gradient(#FFE45C,#F5B800);
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
}

.card .provider-name {
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-size: 17px;
    letter-spacing: 0.05em;
    color: #fff;
    margin: 0 0 4px 0;
}

.card .provider-subtitle {
    font-size: 14px;
    color: #8a93a6;
    margin: 0 0 12px 0;
}

.pill {
    display: inline-block;
    background: #0cff6a;
    color: #111;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 0.75rem;
    vertical-align: middle;
    margin-top: 4px;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.pill.missing {
    background: #ff4d4d;
    color: #111;
}

/* Usage rows */
.usage {
    font-size: 0.875rem;
    color: #aaa;
    margin: 4px 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.bar {
    background: #333;
    height: 6px;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
}

.bar > div {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #FFE45C, #F5B800);
}

.bar.hot > div {
    background: linear-gradient(90deg, #ff4d4d, #ff004d);
}

/* Usage trend sparklines */
.spark {
    display: block;
    width: 100%;
    max-width: 220px;
    height: 36px;
    margin: 8px 0 4px 0;
}

.spark .spark-line {
    fill: none;
    stroke: #4a9eff;
    stroke-width: 1.5;
}

.spark .spark-area {
    fill: rgba(74, 158, 255, 0.12);
    stroke: none;
}

.spark .spark-grid {
    stroke: #1e2430;
    stroke-width: 1;
}

.trend-today {
    font-size: 0.8rem;
    color: #dde;
    margin: 2px 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

.trend-limit {
    font-size: 0.72rem;
    color: #6b7280;
    margin: 2px 0;
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}

/* Composer card */
.composer {
    animation: fadeUp .7s .12s cubic-bezier(.2,.7,.3,1) both;
    background: #101014;
    border-radius: 12px;
    padding: 20px;
    margin: 20px auto;
    max-width: 1080px;
    border: 1px solid #1e2430;
}

.composer h2 {
    margin: 0 0 12px 0;
    font-size: 24px;
    letter-spacing: .08em;
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
}

.composer h2 span.accent {
    color: #FFD500;
}














@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
}

/* Refresh button */
.refresh {
    display: block;
    margin: 20px auto;
    padding: 12px 28px;
    background: #141418;
    color: #FFD500;
    border: 1px solid rgba(255,213,0,.35);
    border-radius: 8px;
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
}

.refresh:hover {
    filter: brightness(1.1);
}

/* Typography */
::placeholder {
    color: #555;
}

/* Eyebrow labels */
.eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    color: #FFD500;
    letter-spacing: 0.32em;
    margin-bottom: 8px;
    text-transform: uppercase;
}

/* Mobile */
@media (max-width: 640px) {
    .header {
        padding: 16px;
    }

    .hero, .provider-grid, .composer {
        margin: 16px;
        padding: 24px;
    }

    .hero h2 {
        font-size: 2rem;
    }

    .composer button {
        width: 100%;
        padding: 16px;
    }

    .card {
        padding: 24px;
    }
}


/* ===== Task Composer: chat UI ===== */
.thread{background:#08080b;border:1px solid #1e1e24;border-radius:12px;min-height:230px;max-height:430px;
overflow-y:auto;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.thread-empty{text-align:center;color:#5a5a64;margin:auto;padding:28px 20px}
.thread-empty svg{width:44px;opacity:.35;margin-bottom:8px}
.thread-empty p{font-size:13px;line-height:1.6;margin:0}
.msg{max-width:88%;animation:fadeUp .3s both}
.msg-user{align-self:flex-end}
.msg-user .msg-body{background:linear-gradient(#FFE45C,#F5B800);color:#0a0a0a;border-radius:16px 16px 4px 16px;
padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg-ai{align-self:flex-start}
.msg-ai .msg-body{background:#141419;border:1px solid rgba(255,213,0,.12);color:#e8e8ea;border-radius:16px 16px 16px 4px;
padding:10px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg-system{align-self:center;max-width:100%}
.msg-system .msg-body{background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.3);color:#ff9a9a;
border-radius:10px;padding:8px 14px;font-size:13px}
.msg-meta{font-size:11px;color:#FFD500;margin-bottom:4px;letter-spacing:.08em;font-family:'Oswald',sans-serif}
.typing{display:flex;gap:6px;padding:13px 15px;background:#141419;border:1px solid rgba(255,213,0,.12);border-radius:16px}
.typing span{width:8px;height:8px;border-radius:50%;background:#FFD500;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.composer-controls{background:transparent}
.ctrl-row{display:flex;gap:10px;margin-bottom:10px}
.ctrl-field{flex:1;min-width:0}
.ctrl-field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a92;
margin-bottom:6px;font-family:'Oswald',sans-serif;font-weight:500}
.ctrl-field select,.ctrl-field input{width:100%;background:#0a0a0d;border:1px solid #26262c;border-radius:8px;
color:#e8e8ea;padding:11px 12px;font-size:14px;font-family:inherit}
.ctrl-field select:focus,.ctrl-field input:focus{outline:none;border-color:#FFD500;box-shadow:0 0 0 3px rgba(255,213,0,.15)}
.input-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:end}
.attach-wrap{position:relative;flex:none}
#attach-plus{width:44px;height:44px;border-radius:50%;background:#141418;border:1px solid rgba(255,213,0,.35);
color:#FFD500;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
#attach-plus:hover{background:rgba(255,213,0,.12);box-shadow:0 0 16px rgba(255,213,0,.2)}
#attach-menu{position:absolute;left:0;bottom:52px;background:#101014;border:1px solid rgba(255,213,0,.18);
border-radius:12px;padding:8px;z-index:100;min-width:280px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.attach-title{padding:10px 14px 6px;color:#e8e8ea;font-weight:600;font-size:14px}
.attach-opt{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#e8e8ea;
padding:10px 14px;cursor:pointer;border-radius:8px;text-align:left;font-size:14px}
.attach-opt:hover{background:rgba(255,213,0,.07)}
.attach-opt .dot{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.5)}
.attach-opt .opt-sub{font-size:12px;color:#8a8a92}
#composer-message{flex:1;min-width:0;background:#0a0a0d;border:1px solid #26262c;border-radius:22px;color:#e8e8ea;
padding:12px 16px;font-size:14px;font-family:inherit;line-height:1.45;resize:none;min-height:44px;max-height:130px}
#composer-message:focus{outline:none;border-color:#FFD500;box-shadow:0 0 0 3px rgba(255,213,0,.15)}
#composer-send{flex:none;height:44px;padding:0 24px;border-radius:22px;background:linear-gradient(#FFE45C,#F5B800);
color:#0a0a0a;border:1px solid #0a0a0a;box-shadow:0 0 24px rgba(255,213,0,.25), inset 0 1px 0 rgba(255,255,255,.5);
font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .15s}
#composer-send:hover{filter:brightness(1.06);box-shadow:0 0 36px rgba(255,213,0,.4), inset 0 1px 0 rgba(255,255,255,.5)}
#composer-send:disabled{opacity:.55;cursor:wait}
#attach-preview{margin-top:10px}
#attach-preview:empty{margin-top:0}
@media(max-width:560px){
.ctrl-row{flex-direction:column;gap:8px}
.msg{max-width:94%}
#composer-send{padding:0 16px;font-size:12px;letter-spacing:.12em}
#composer-message{min-width:0}
#attach-plus{width:40px;height:40px;font-size:20px}
#composer-send{height:40px}
.thread{min-height:150px;max-height:320px}
.thread-empty{padding:20px 14px}
.thread-empty svg{width:40px;margin-bottom:8px}
.thread-empty p{font-size:12px}
}

/* ===== CINEMATIC LAYER ===== */
body::before{content:"";position:fixed;inset:0;z-index:2000;pointer-events:none;
background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.62) 100%)}
body::after{content:"";position:fixed;inset:-120px;z-index:2001;pointer-events:none;opacity:.05;
background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27140%27%20height%3D%27140%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.85%27%20numOctaves%3D%272%27/%3E%3C/filter%3E%3Crect%20width%3D%27140%27%20height%3D%27140%27%20filter%3D%27url%28%23n%29%27%20opacity%3D%270.55%27/%3E%3C/svg%3E");animation:grainShift 7s steps(8) infinite}
@keyframes grainShift{0%,100%{transform:translate(0,0)}12%{transform:translate(-3%,-5%)}25%{transform:translate(-8%,3%)}37%{transform:translate(4%,-8%)}50%{transform:translate(-3%,8%)}62%{transform:translate(-8%,3%)}75%{transform:translate(6%,0)}87%{transform:translate(0,6%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes batDrift{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-60%) translateX(-26px)}}

</style>
</head>
<body>
<!-- Nexus Sidebar -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap');
.nexus-burger{position:fixed;top:18px;left:18px;z-index:1001;background:#141418;border:1px solid rgba(255,213,0,.35);border-radius:8px;padding:10px 12px;cursor:pointer;color:#FFD500;font-size:20px;line-height:1}
.nexus-sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#0c0c0f;border-right:1px solid rgba(255,213,0,.16);z-index:1000;transition:left .25s ease;padding:70px 0 20px;box-sizing:border-box}
.nexus-sidebar.open{left:0}
.nexus-sidebar a{display:block;padding:14px 24px;color:#9aa3b2;text-decoration:none;font-size:15px;border-left:3px solid transparent}
.nexus-sidebar a:hover{color:#e6e9f0;background:#0f1622}
.nexus-sidebar a.active{color:#FFD500;border-left-color:#FFD500;background:rgba(255,213,0,.06)}
.nexus-sidebar .nav-title{padding:0 24px 12px;color:#FFD500;font-size:15px;letter-spacing:.28em;font-family:'Bebas Neue',sans-serif}
.nexus-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;display:none}
.nexus-overlay.show{display:block}
</style>
<button class="nexus-burger" onclick="document.querySelector('.nexus-sidebar').classList.add('open');document.querySelector('.nexus-overlay').classList.add('show')">☰</button>
<div class="nexus-overlay" onclick="document.querySelector('.nexus-sidebar').classList.remove('open');this.classList.remove('show')"></div>
<nav class="nexus-sidebar">
<div class="nav-title"><svg viewBox="0 0 100 36" style="width:26px;height:10px;vertical-align:baseline;margin-right:8px"><path d="M0,14 L24,3 L39,9 L44,1 L46.5,7 L50,5 L53.5,7 L56,1 L61,9 L76,3 L100,14 L90,20 L83,16 L75,24 L67,18 L59,28 L54,22 L50,30 L46,22 L41,28 L33,18 L25,24 L17,16 L10,20 Z" fill="#FFD500"/></svg>NEXUS LOCAL</div>
<a href="/" data-page="dashboard">Dashboard</a>
<a href="/connections" data-page="connections">Connections</a>
<a href="/settings" data-page="settings">Update Keys</a>
<a href="#" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login');return false">Logout</a>
</nav>
<script>
(function(){
var p=location.pathname;
document.querySelectorAll('.nexus-sidebar a[data-page]').forEach(function(a){
if((p==='/'&&a.dataset.page==='dashboard')||p==='/'+a.dataset.page)a.classList.add('active');
});
})();
</script>

<div class="header">
    <span class="wordmark">Nexus<span class="local-tag">LOCAL</span></span>
    <span class="spacer"></span>
    <button class="logout" id="logout-btn">Logout</button>
</div>

<div class="hero">
    <div class="eyebrow">USAGE OVERVIEW</div>
    <h2>Your providers, <span class="accent">actually</span> under control</h2>
    <div id="combined-usage"></div>
</div>

<!-- Providers moved to /connections -->

<div class="composer" id="composer-card">
    <div class="eyebrow">TASK COMPOSER</div>
    <h2>Chat with <span class="accent">any</span> provider</h2>
    <div class="thread" id="composer-thread">
        <div class="thread-empty" id="thread-empty">
            <svg viewBox="0 0 100 36"><path d="M0,14 L24,3 L39,9 L44,1 L46.5,7 L50,5 L53.5,7 L56,1 L61,9 L76,3 L100,14 L90,20 L83,16 L75,24 L67,18 L59,28 L54,22 L50,30 L46,22 L41,28 L33,18 L25,24 L17,16 L10,20 Z" fill="#FFD500"/></svg>
            <p>Pick a provider below and say hello.<br>Your chats stay in this session.</p>
        </div>
    </div>
    <div class="composer-controls">
        <div class="ctrl-row">
            <div class="ctrl-field">
                <label for="composer-provider">Provider</label>
                <select id="composer-provider" onchange="loadModels(this.value)"></select>
            </div>
            <div class="ctrl-field">
                <label for="composer-model">Model</label>
                <input type="text" id="composer-model" placeholder="e.g. llama-3.1-8b-instant">
            </div>
        </div>
        <div class="input-bar">
            <div class="attach-wrap">
                <button type="button" id="attach-plus" title="Attach">+</button>
                <div id="attach-menu" style="display:none">
                    <div class="attach-title">Add attachment</div>
                    <button class="attach-opt" data-type="camera"><span class="dot" style="background:#FFD500"></span><span><div>Camera</div><div class="opt-sub">Take a photo &middot; 8 MB max</div></span></button>
                    <button class="attach-opt" data-type="photos"><span class="dot" style="background:#4dd0e1"></span><span><div>Photos</div><div class="opt-sub">Choose from gallery &middot; 8 MB max</div></span></button>
                    <button class="attach-opt" data-type="videos"><span class="dot" style="background:#f5c518"></span><span><div>Videos</div><div class="opt-sub">Choose a video &middot; 20 MB max</div></span></button>
                    <button class="attach-opt" data-type="files"><span class="dot" style="background:#c0c0c0"></span><span><div>Files</div><div class="opt-sub">PDF, DOCX, TXT, MD, CSV, JSON, LOG &middot; 10 MB max</div></span></button>
                    <button class="attach-opt" data-type="link"><span class="dot" style="background:#FFE45C"></span><span><div>Link</div><div class="opt-sub">Paste any photo or video link</div></span></button>
                </div>
            </div>
            <textarea id="composer-message" rows="1" placeholder="Type a message...  (Enter to send)"></textarea>
            <button id="composer-send">Send</button>
        </div>
        <input type="file" id="attach-input" accept="image/*,video/*,.pdf,.docx,.txt,.md,.csv,.json,.log" style="display:none">
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
        <div id="attach-preview"></div>
    </div>
</div>

<button class="refresh" id="refresh-quotas">Refresh</button>

<script>
const providerGrid = document.getElementById('provider-grid');
const combinedUsage = document.getElementById('combined-usage');
const logoutBtn = document.getElementById('logout-btn');
const composerProviders = document.getElementById('composer-provider');
const composerSend = document.getElementById('composer-send');
const thread = document.getElementById('composer-thread');
function hideEmpty(){const e=document.getElementById('thread-empty');if(e)e.style.display='none';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function addMsg(kind,text,meta){
  const div=document.createElement('div');div.className='msg msg-'+kind;
  div.innerHTML=(meta?'<div class="msg-meta">'+esc(meta)+'</div>':'')+'<div class="msg-body">'+esc(text)+'</div>';
  thread.appendChild(div);thread.scrollTop=thread.scrollHeight;return div;
}
function addTyping(){
  const div=document.createElement('div');div.className='msg msg-ai';
  div.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  thread.appendChild(div);thread.scrollTop=thread.scrollHeight;return div;
}

async function fetchQuotas() {
    try {
        const r = await fetch('/api/quotas');
        if (r.status === 401) {
            location.href = '/login';
            return;
        }
        const data = await r.json();
        renderUsage(data);
    } catch (e) {
        console.error(e);
        providerGrid.innerHTML = '<p style="color: #ff8">Failed to load quotas</p>';
    }
}

function friendlyName(provider) {
    if (provider.startsWith('relay_')) {
        const base = provider.replace('relay_', '');
        return 'Relay: ' + base.charAt(0).toUpperCase() + base.slice(1);
    }
    if (provider === 'freellmapi') return 'FreeLLMAPI: Gateway';
    return 'FreeLLMAPI: ' + provider.charAt(0).toUpperCase() + provider.slice(1);
}

async function populateComposer() {
    try {
        const r = await fetch('/api/quotas');
        const data = await r.json();
        composerProviders.innerHTML = '';
        data.providers.forEach(p => {
            if (p.key_configured) {
                const opt = document.createElement('option');
                opt.value = p.provider;
                opt.textContent = friendlyName(p.provider);
                composerProviders.appendChild(opt);
            }
        });
        // Load models for first provider
        if (composerProviders.value) loadModels(composerProviders.value);
    } catch (e) {
        console.error('Composer init', e);
    }
}

async function loadModels(provider) {
    const modelInput = document.getElementById('composer-model');
    try {
        const r = await fetch('/api/models?provider=' + encodeURIComponent(provider));
        const data = await r.json();
        const models = data.models || [];
        // Replace text input with datalist for autocomplete
        let dl = document.getElementById('model-datalist');
        if (!dl) {
            dl = document.createElement('datalist');
            dl.id = 'model-datalist';
            document.body.appendChild(dl);
            modelInput.setAttribute('list', 'model-datalist');
        }
        dl.innerHTML = '';
        models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            dl.appendChild(opt);
        });
    } catch (e) {
        console.error('Model load', e);
    }
}

function barRow(label, used, limit) {
    if (limit == null) return `<div class="usage">${label}: ${used} – <i class="nocap">No published cap</i></div>`;
    const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
    const hot = pct >= 90 ? ' hot' : '';
    return `<div class="usage">${label}: ${used}/${limit}</div><div class="bar${hot}"><div style="width: ${pct}%"></div></div>`;
}

function sparkline(data, label) {
    const w = 220, h = 36, pad = 3;
    const max = Math.max.apply(null, data.concat([1]));
    const min = Math.min.apply(null, data.concat([0]));
    const range = (max - min) || 1;
    const stepX = (w - pad * 2) / (data.length - 1);
    const pts = data.map(function(v, i) {
        const x = (pad + i * stepX).toFixed(1);
        const y = (h - pad - ((v - min) / range) * (h - pad * 2)).toFixed(1);
        return x + ',' + y;
    });
    const line = pts.join(' ');
    const area = pad + ',0 ' + line + ' ' + (w - pad).toFixed(1) + ',0';
    const gridY = (h / 2).toFixed(1);
    const esc = (label || '').replace(/"/g, '&quot;');
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc + '">'
        + '<line class="spark-grid" x1="' + pad + '" y1="' + gridY + '" x2="' + (w - pad) + '" y2="' + gridY + '"/>'
        + '<polygon class="spark-area" points="' + area + '"/>'
        + '<polyline class="spark-line" points="' + line + '"/>'
        + '</svg>';
}

function renderUsage(data) {
    const providers = data.providers || [];
    if (providerGrid) providerGrid.innerHTML = '';
    if (combinedUsage) combinedUsage.innerHTML = '';
    // Combined 7-day history (d0 = today at index 6)
    const ch = data.history || {requests: [0,0,0,0,0,0,0], tokens: [0,0,0,0,0,0,0]};
    const totReqToday = ch.requests[6] || 0;
    const totTokToday = ch.tokens[6] || 0;
    combinedUsage.innerHTML = '<h3>Combined Usage</h3>'
        + '<div class="usage">Resets vary by provider — see individual cards below</div>'
        + sparkline(ch.requests, 'Combined 7-day requests')
        + '<div class="trend-today">' + totReqToday + ' requests · ' + totTokToday.toLocaleString() + ' tokens today</div>';
    providers.forEach(function(p) {
        const div = document.createElement('div');
        div.className = 'card';
        const h = p.history || {requests: [0,0,0,0,0,0,0], tokens: [0,0,0,0,0,0,0]};
        const reqToday = h.requests[6] || 0;
        const tokToday = h.tokens[6] || 0;
        // Only show a limit where one is really published — never invent.
        let limitText = '';
        const drl = p.limits && p.limits.daily_requests && p.limits.daily_requests.limit;
        if (typeof drl === 'number') {
            limitText = '<div class="trend-limit">Limit: ' + drl + '/day</div>';
        }
        div.innerHTML = '<div class="icon">◆</div><div>'
            + '<h3 class="provider-name">' + escapeHtml(p.display_name || p.provider) + '</h3>'
            + '<div class="usage">Key: <span class="pill' + (p.key_configured ? '' : ' missing') + '">'
            + (p.key_configured ? '✓' : '✗') + '</span></div>'
            + '<div class="usage">Reset: ' + escapeHtml(p.reset || '') + '</div>'
            + sparkline(h.requests, (p.display_name || p.provider) + ' 7-day requests')
            + '<div class="trend-today">' + reqToday + ' requests · ' + tokToday.toLocaleString() + ' tokens today</div>'
            + limitText
            + '</div>';
        if (providerGrid) providerGrid.appendChild(div);
    });
}

function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

populateComposer();
fetchQuotas();
setInterval(fetchQuotas, 10000);

document.getElementById("refresh-quotas").addEventListener("click", async () => {
    const r = await fetch("/api/refresh", { method: "POST" });
    if (r.status === 401) {
        location.href = "/login";
        return;
    }
    fetchQuotas();
});

logoutBtn.addEventListener('click', () => {
    fetch('/api/logout', { method: 'POST' }).then(() => location.href = '/login');
});


// Attachment handling with + menu
let attachedImage = null;
let attachedFile = null;
let attachedLink = null;
const attachPlus = document.getElementById('attach-plus');
const attachMenu = document.getElementById('attach-menu');
const attachInput = document.getElementById('attach-input');
const cameraInput = document.getElementById('camera-input');
const attachPreview = document.getElementById('attach-preview');

if (attachPlus && attachMenu) {
    attachPlus.addEventListener('click', (e) => {
        e.stopPropagation();
        attachMenu.style.display = attachMenu.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', (e) => {
        if (!attachMenu.contains(e.target)) attachMenu.style.display = 'none';
    });
    // Hover effect for options
    document.querySelectorAll('.attach-opt').forEach(btn => {
        btn.addEventListener('mouseenter', () => btn.style.background = 'rgba(255,213,0,.07)');
        btn.addEventListener('mouseleave', () => btn.style.background = 'none');
        btn.addEventListener('click', () => {
            attachMenu.style.display = 'none';
            const type = btn.dataset.type;
            if (type === 'camera') cameraInput.click();
            else if (type === 'link') {
                const url = prompt('Paste image or video URL:');
                if (url) {
                    attachedLink = url;
                    showPreview('link', url);
                }
            }
            else {
                attachInput.dataset.type = type;
                attachInput.click();
            }
        });
    });
}

function showPreview(type, src, name) {
    let previewHtml = '';
    if (type === 'image' || type === 'camera' || type === 'photos') {
        previewHtml = '<img src="' + src + '" style="max-width:200px;border-radius:8px;border:1px solid rgba(255,213,0,.2)">';
    } else if (type === 'videos') {
        previewHtml = '<video src="' + src + '" style="max-width:200px;border-radius:8px" controls></video>';
    } else if (type === 'files') {
        previewHtml = '<div style="background:#141419;border:1px solid rgba(255,213,0,.2);padding:12px;border-radius:8px;font-size:13px">File: ' + (name || 'File') + '</div>';
    } else if (type === 'link') {
        previewHtml = '<div style="background:#141419;border:1px solid rgba(255,213,0,.2);padding:12px;border-radius:8px;font-size:13px;word-break:break-all">Link: ' + src.substring(0,50) + '</div>';
    }
    attachPreview.innerHTML = previewHtml
        + '<button type="button" onclick="clearAttachment()" style="margin-left:8px;background:#ef4444;border:0;border-radius:8px;color:#fff;padding:8px 12px;cursor:pointer">✕</button>';
}

function handleFile(file, type) {
    if (!file) return;
    const maxSizes = { camera: 8, photos: 8, videos: 20, files: 10 };
    const maxMB = maxSizes[type] || 8;
    if (file.size > maxMB * 1024 * 1024) {
        alert('File too large (max ' + maxMB + 'MB)');
        return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        if (type === 'camera' || type === 'photos' || file.type.startsWith('image/')) {
            attachedImage = dataUrl;
            attachedFile = null;
            showPreview('image', dataUrl);
        } else if (type === 'videos' || file.type.startsWith('video/')) {
            attachedFile = { name: file.name, data: dataUrl, type: file.type };
            attachedImage = null;
            showPreview('videos', dataUrl);
        } else {
            // Document file - read as text if possible
            if (file.type.startsWith('text/') || file.name.match(/\.(txt|md|csv|json|log)$/i)) {
                const textReader = new FileReader();
                textReader.onload = (tev) => {
                    attachedFile = { name: file.name, text: tev.target.result, type: file.type };
                    showPreview('files', null, file.name);
                };
                textReader.readAsText(file);
            } else {
                attachedFile = { name: file.name, data: dataUrl, type: file.type };
                showPreview('files', null, file.name);
            }
            attachedImage = null;
        }
    };
    reader.readAsDataURL(file);
}

if (attachInput) {
    attachInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0], attachInput.dataset.type || 'photos');
    });
}
if (cameraInput) {
    cameraInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0], 'camera');
    });
}

function clearAttachment() {
    attachedImage = null;
    attachedFile = null;
    attachedLink = null;
    if (attachInput) attachInput.value = '';
    if (cameraInput) cameraInput.value = '';
    if (attachPreview) attachPreview.innerHTML = '';
}

const composerMsg = document.getElementById('composer-message');
composerMsg.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); composerSend.click(); }
});
composerMsg.addEventListener('input', () => {
    composerMsg.style.height = 'auto';
    composerMsg.style.height = Math.min(composerMsg.scrollHeight, 130) + 'px';
});
composerSend.addEventListener('click', async () => {
    const provider = composerProviders.value;
    const model = document.getElementById('composer-model').value;
    const msg = composerMsg.value.trim();
    if (!provider || !model || !msg) {
        hideEmpty(); addMsg('system', 'Please select a provider, model, and enter a message');
        return;
    }
    hideEmpty();
    addMsg('user', msg);
    composerMsg.value = ''; composerMsg.style.height = 'auto';
    const typingEl = addTyping();
    composerSend.disabled = true;
    try {
        const payload = { provider, model, message: msg };
        if (attachedImage) payload.image = attachedImage;
        if (attachedFile) payload.file = attachedFile;
        if (attachedLink) payload.link = attachedLink;
        const r = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const j = await r.json();
        typingEl.remove();
        if (j.error) addMsg('system', j.error);
        else addMsg('ai', j.reply, friendlyName(provider) + '  ·  ' + model);
    } catch (e) {
        typingEl.remove();
        addMsg('system', 'Error: ' + e.message);
    } finally {
        composerSend.disabled = false;
        clearAttachment();
    }
});
</script>
