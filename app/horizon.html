<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Local — Horizon</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  /* Horizon hero — vanilla port of components/ui/horizon-hero-section
     (the React version lives in the DSRclone web app). CSS mirrors the
     scoped stylesheet written for it in that project's globals.css. */
  .hero-container {
    position: relative;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .hero-container .hero-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  .hero-container .hero-content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    pointer-events: none;
  }
  .hero-container .hero-title {
    font-size: clamp(3.5rem, 13vw, 11rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 0.95;
    margin: 0;
    text-transform: uppercase;
  }
  .hero-container .hero-title .title-char { display: inline-block; }
  .hero-container .hero-subtitle {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 2vw, 1.5rem);
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.75);
  }
  .hero-container .hero-subtitle p { margin: 0; }
  .hero-container .side-menu {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 2rem 1.25rem;
  }
  .hero-container .menu-icon { display: flex; flex-direction: column; gap: 6px; }
  .hero-container .menu-icon span { display: block; width: 26px; height: 2px; background: #fff; }
  .hero-container .vertical-text {
    writing-mode: vertical-rl;
    letter-spacing: 0.6em;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.7);
  }
  .hero-container .scroll-progress {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 2rem;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 1rem;
    width: min(420px, 80vw);
  }
  .hero-container .scroll-text {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: rgba(255, 255, 255, 0.7);
  }
  .hero-container .progress-track {
    flex: 1;
    height: 2px;
    background: rgba(255, 255, 255, 0.2);
    overflow: hidden;
  }
  .hero-container .progress-fill {
    height: 100%;
    background: #fff;
    transition: width 0.2s ease-out;
  }
  .hero-container .section-counter {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.85);
    white-space: nowrap;
  }
  .hero-container .scroll-sections { position: relative; z-index: 2; }
  .hero-container .content-section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    pointer-events: none;
  }
  @media (max-width: 768px) {
    .hero-container .side-menu { display: none; }
    .hero-container .hero-content,
    .hero-container .content-section { padding: 0 6vw; }
  }
</style>
</head>
<body>
<div class="hero-container cosmos-style">
  <canvas id="heroCanvas" class="hero-canvas"></canvas>

  <div id="sideMenu" class="side-menu" style="visibility: hidden">
    <div class="menu-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="vertical-text">SPACE</div>
  </div>

  <div class="hero-content cosmos-content">
    <h1 id="heroTitle" class="hero-title">HORIZON</h1>
    <div id="heroSubtitle" class="hero-subtitle cosmos-subtitle">
      <p class="subtitle-line">Where vision meets reality,</p>
      <p class="subtitle-line">we shape the future of tomorrow</p>
    </div>
  </div>

  <div id="scrollProgress" class="scroll-progress" style="visibility: hidden">
    <div class="scroll-text">SCROLL</div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill" style="width: 0%"></div>
    </div>
    <div id="sectionCounter" class="section-counter">01 / 02</div>
  </div>

  <div class="scroll-sections">
    <section class="content-section">
      <h1 class="hero-title">COSMOS</h1>
      <div class="hero-subtitle cosmos-subtitle">
        <p class="subtitle-line">Beyond the boundaries of imagination,</p>
        <p class="subtitle-line">lies the universe of possibilities</p>
      </div>
    </section>
    <section class="content-section">
      <h1 class="hero-title">INFINITY</h1>
      <div class="hero-subtitle cosmos-subtitle">
        <p class="subtitle-line">In the space between thought and creation,</p>
        <p class="subtitle-line">we find the essence of true innovation</p>
      </div>
    </section>
  </div>
</div>

<script src="/vendor/gsap.min.js"></script>
<script src="/vendor/ScrollTrigger.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.js",
    "three/addons/": "/vendor/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

gsap.registerPlugin(ScrollTrigger);

const totalSections = 2;
const refs = {
  scene: null, camera: null, renderer: null, composer: null,
  stars: [], nebula: null, mountains: [], animationId: null,
  targetCameraX: 0, targetCameraY: 30, targetCameraZ: 300,
  locations: []
};
const smoothCameraPos = { x: 0, y: 30, z: 100 };

// Split the title into per-char spans so the GSAP intro can animate them.
const titleEl = document.getElementById('heroTitle');
titleEl.innerHTML = titleEl.textContent.split('').map(
  (c) => `<span class="title-char">${c}</span>`).join('');

function createStarField() {
  const starCount = 5000;
  for (let i = 0; i < 3; i++) {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starCount * 3);
    const colors = new Float32Array(starCount * 3);
    const sizes = new Float32Array(starCount);
    for (let j = 0; j < starCount; j++) {
      const radius = 200 + Math.random() * 800;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      positions[j * 3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[j * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[j * 3 + 2] = radius * Math.cos(phi);
      const color = new THREE.Color();
      const colorChoice = Math.random();
      if (colorChoice < 0.7) {
        color.setHSL(0, 0, 0.8 + Math.random() * 0.2);
      } else if (colorChoice < 0.9) {
        color.setHSL(0.08, 0.5, 0.8);
      } else {
        color.setHSL(0.6, 0.5, 0.8);
      }
      colors[j * 3] = color.r;
      colors[j * 3 + 1] = color.g;
      colors[j * 3 + 2] = color.b;
      sizes[j] = Math.random() * 2 + 0.5;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    const material = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 }, depth: { value: i } },
      vertexShader: `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        uniform float time;
        uniform float depth;
        void main() {
          vColor = color;
          vec3 pos = position;
          float angle = time * 0.05 * (1.0 - depth * 0.3);
          mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
          pos.xy = rot * pos.xy;
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = size * (300.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          float dist = length(gl_PointCoord - vec2(0.5));
          if (dist > 0.5) discard;
          float opacity = 1.0 - smoothstep(0.0, 0.5, dist);
          gl_FragColor = vec4(vColor, opacity);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const stars = new THREE.Points(geometry, material);
    refs.scene.add(stars);
    refs.stars.push(stars);
  }
}

function createNebula() {
  const geometry = new THREE.PlaneGeometry(8000, 4000, 100, 100);
  const material = new THREE.ShaderMaterial({
    uniforms: {
      time: { value: 0 },
      color1: { value: new THREE.Color(0x0033ff) },
      color2: { value: new THREE.Color(0xff0066) },
      opacity: { value: 0.3 }
    },
    vertexShader: `
      varying vec2 vUv;
      varying float vElevation;
      uniform float time;
      void main() {
        vUv = uv;
        vec3 pos = position;
        float elevation = sin(pos.x * 0.01 + time) * cos(pos.y * 0.01 + time) * 20.0;
        pos.z += elevation;
        vElevation = elevation;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 color1;
      uniform vec3 color2;
      uniform float opacity;
      uniform float time;
      varying vec2 vUv;
      varying float vElevation;
      void main() {
        float mixFactor = sin(vUv.x * 10.0 + time) * cos(vUv.y * 10.0 + time);
        vec3 color = mix(color1, color2, mixFactor * 0.5 + 0.5);
        float alpha = opacity * (1.0 - length(vUv - 0.5) * 2.0);
        alpha *= 1.0 + vElevation * 0.01;
        gl_FragColor = vec4(color, alpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const nebula = new THREE.Mesh(geometry, material);
  nebula.position.z = -1050;
  nebula.rotation.x = 0;
  refs.scene.add(nebula);
  refs.nebula = nebula;
}

function createMountains() {
  const layers = [
    { distance: -50, height: 60, color: 0x1a1a2e, opacity: 1 },
    { distance: -100, height: 80, color: 0x16213e, opacity: 0.8 },
    { distance: -150, height: 100, color: 0x0f3460, opacity: 0.6 },
    { distance: -200, height: 120, color: 0x0a4668, opacity: 0.4 }
  ];
  layers.forEach((layer) => {
    const points = [];
    const segments = 50;
    for (let i = 0; i <= segments; i++) {
      const x = (i / segments - 0.5) * 1000;
      const y = Math.sin(i * 0.1) * layer.height +
        Math.sin(i * 0.05) * layer.height * 0.5 +
        Math.random() * layer.height * 0.2 - 100;
      points.push(new THREE.Vector2(x, y));
    }
    points.push(new THREE.Vector2(5000, -300));
    points.push(new THREE.Vector2(-5000, -300));
    const shape = new THREE.Shape(points);
    const geometry = new THREE.ShapeGeometry(shape);
    const material = new THREE.MeshBasicMaterial({
      color: layer.color,
      transparent: true,
      opacity: layer.opacity,
      side: THREE.DoubleSide
    });
    const mountain = new THREE.Mesh(geometry, material);
    mountain.position.z = layer.distance;
    mountain.position.y = layer.distance;
    mountain.userData = { baseZ: layer.distance };
    refs.scene.add(mountain);
    refs.mountains.push(mountain);
  });
}

function createAtmosphere() {
  const geometry = new THREE.SphereGeometry(600, 32, 32);
  const material = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPosition;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPosition = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      varying vec3 vPosition;
      uniform float time;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
        vec3 atmosphere = vec3(0.3, 0.6, 1.0) * intensity;
        float pulse = sin(time * 2.0) * 0.1 + 0.9;
        atmosphere *= pulse;
        gl_FragColor = vec4(atmosphere, intensity * 0.25);
      }
    `,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    transparent: true
  });
  refs.scene.add(new THREE.Mesh(geometry, material));
}

function animate() {
  refs.animationId = requestAnimationFrame(animate);
  const time = Date.now() * 0.001;
  refs.stars.forEach((starField) => {
    if (starField.material.uniforms) {
      starField.material.uniforms.time.value = time;
    }
  });
  if (refs.nebula) {
    refs.nebula.material.uniforms.time.value = time * 0.5;
  }
  if (refs.camera) {
    const smoothingFactor = 0.05;
    smoothCameraPos.x += (refs.targetCameraX - smoothCameraPos.x) * smoothingFactor;
    smoothCameraPos.y += (refs.targetCameraY - smoothCameraPos.y) * smoothingFactor;
    smoothCameraPos.z += (refs.targetCameraZ - smoothCameraPos.z) * smoothingFactor;
    const floatX = Math.sin(time * 0.1) * 2;
    const floatY = Math.cos(time * 0.15) * 1;
    refs.camera.position.x = smoothCameraPos.x + floatX;
    refs.camera.position.y = smoothCameraPos.y + floatY;
    refs.camera.position.z = smoothCameraPos.z;
    refs.camera.lookAt(0, 10, -600);
  }
  refs.mountains.forEach((mountain, i) => {
    const parallaxFactor = 1 + i * 0.5;
    mountain.position.x = Math.sin(time * 0.1) * 2 * parallaxFactor;
    mountain.position.y = 50 + Math.cos(time * 0.15) * 1 * parallaxFactor;
  });
  if (refs.composer) {
    refs.composer.render();
  }
}

function initThree() {
  refs.scene = new THREE.Scene();
  refs.scene.fog = new THREE.FogExp2(0x000000, 0.00025);

  refs.camera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 2000);
  refs.camera.position.z = 100;
  refs.camera.position.y = 20;

  refs.renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('heroCanvas'),
    antialias: true,
    alpha: true
  });
  refs.renderer.setSize(window.innerWidth, window.innerHeight);
  refs.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  refs.renderer.toneMapping = THREE.ACESFilmicToneMapping;
  refs.renderer.toneMappingExposure = 0.5;

  refs.composer = new EffectComposer(refs.renderer);
  refs.composer.addPass(new RenderPass(refs.scene, refs.camera));
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85);
  refs.composer.addPass(bloomPass);

  createStarField();
  createNebula();
  createMountains();
  createAtmosphere();
  refs.locations = refs.mountains.map((m) => m.position.z);
  animate();
}

initThree();

window.addEventListener('resize', () => {
  if (refs.camera && refs.renderer && refs.composer) {
    refs.camera.aspect = window.innerWidth / window.innerHeight;
    refs.camera.updateProjectionMatrix();
    refs.renderer.setSize(window.innerWidth, window.innerHeight);
    refs.composer.setSize(window.innerWidth, window.innerHeight);
  }
});

// GSAP intro (mirrors the React version's timeline)
const menuEl = document.getElementById('sideMenu');
const subtitleEl = document.getElementById('heroSubtitle');
const progressEl = document.getElementById('scrollProgress');
gsap.set([menuEl, titleEl, subtitleEl, progressEl], { visibility: 'visible' });
const tl = gsap.timeline();
tl.from(menuEl, { x: -100, opacity: 0, duration: 1, ease: 'power3.out' });
tl.from(titleEl.querySelectorAll('.title-char'), {
  y: 200, opacity: 0, duration: 1.5, stagger: 0.05, ease: 'power4.out'
}, '-=0.5');
tl.from(subtitleEl.querySelectorAll('.subtitle-line'), {
  y: 50, opacity: 0, duration: 1, stagger: 0.2, ease: 'power3.out'
}, '-=0.8');
tl.from(progressEl, { opacity: 0, y: 50, duration: 1, ease: 'power2.out' }, '-=0.5');

// Scroll handling (same camera flight as the React version)
const progressFill = document.getElementById('progressFill');
const sectionCounter = document.getElementById('sectionCounter');
function handleScroll() {
  const scrollY = window.scrollY;
  const windowHeight = window.innerHeight;
  const documentHeight = document.documentElement.scrollHeight;
  const maxScroll = documentHeight - windowHeight;
  const progress = maxScroll > 0 ? Math.min(scrollY / maxScroll, 1) : 0;

  progressFill.style.width = `${progress * 100}%`;
  const newSection = Math.floor(progress * totalSections);
  sectionCounter.textContent =
    `${String(newSection).padStart(2, '0')} / ${String(totalSections).padStart(2, '0')}`;

  const totalProgress = progress * totalSections;
  const sectionProgress = totalProgress % 1;
  const cameraPositions = [
    { x: 0, y: 30, z: 300 },
    { x: 0, y: 40, z: -50 },
    { x: 0, y: 50, z: -700 }
  ];
  const currentPos = cameraPositions[newSection] || cameraPositions[0];
  const nextPos = cameraPositions[newSection + 1] || currentPos;
  refs.targetCameraX = currentPos.x + (nextPos.x - currentPos.x) * sectionProgress;
  refs.targetCameraY = currentPos.y + (nextPos.y - currentPos.y) * sectionProgress;
  refs.targetCameraZ = currentPos.z + (nextPos.z - currentPos.z) * sectionProgress;

  refs.mountains.forEach((mountain, i) => {
    const speed = 1 + i * 0.9;
    const targetZ = mountain.userData.baseZ + scrollY * speed * 0.5;
    if (refs.nebula) {
      refs.nebula.position.z = targetZ + progress * speed * 0.01 - 100;
    }
    mountain.userData.targetZ = targetZ;
    if (progress > 0.7) {
      mountain.position.z = 600000;
    }
    if (progress < 0.7 && refs.locations[i] !== undefined) {
      mountain.position.z = refs.locations[i];
    }
  });
  if (refs.nebula && refs.mountains[3]) {
    refs.nebula.position.z = refs.mountains[3].position.z;
  }
}
window.addEventListener('scroll', handleScroll);
handleScroll();
</script>
</body>
</html>
