<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Local - Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
background-color:#08080a;
background-image:radial-gradient(ellipse 90% 45% at 50% -5%, rgba(255,213,0,.08), transparent 70%);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#e8e8ea}
.wrap{text-align:center;width:100%;max-width:420px;position:relative}
.bat-emblem{width:76px;height:30px;margin:0 auto 14px;filter:drop-shadow(0 0 18px rgba(255,213,0,.45))}
.bat-emblem path{fill:#FFD500}
.mc-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,11vw,64px);color:#f2f2f4;
margin:0;letter-spacing:.14em;line-height:1;
background:linear-gradient(#ffffff,#b8b8c0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mc-logo .g{background:linear-gradient(#FFE45C,#F5B800);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tagline{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.42em;color:#8a8a92;margin:10px 0 26px;text-transform:uppercase}
.gold-div{height:2px;background:linear-gradient(90deg,transparent,rgba(255,213,0,.7),transparent);margin-bottom:26px}
.card{background:rgba(16,16,20,.92);border:1px solid rgba(255,213,0,.16);border-radius:14px;
box-shadow:0 24px 64px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
padding:30px 26px;text-align:left;backdrop-filter:blur(4px)}
.card h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.1em;color:#fff;margin:0 0 4px}
.card p{color:#8a8a92;font-size:13px;margin:0 0 20px}
input{width:100%;background:#0a0a0d;border:1px solid #26262c;border-radius:8px;
color:#e8e8ea;padding:14px;font-size:15px;margin-bottom:16px;transition:border-color .2s, box-shadow .2s}
input:focus{outline:none;border-color:#FFD500;box-shadow:0 0 0 3px rgba(255,213,0,.15)}
button{width:100%;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.22em;text-transform:uppercase;
color:#0a0a0a;background:linear-gradient(#FFE45C,#F5B800);border:1px solid #0a0a0a;border-radius:8px;
box-shadow:0 0 28px rgba(255,213,0,.28), inset 0 1px 0 rgba(255,255,255,.55);
padding:16px;cursor:pointer;transition:filter .15s, transform .1s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:wait}
#error{display:none;background:rgba(60,10,10,.6);border:1px solid #ff4d4d;color:#ff9a9a;font-size:13px;
border-radius:8px;padding:10px 12px;margin-bottom:16px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.link{margin-top:20px;color:#8a8a92;font-size:13px}
.link a{color:#FFD500;text-decoration:none;font-weight:600}
.link a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<svg class="bat-emblem" viewBox="0 0 100 36"><path d="M0,14 L24,3 L39,9 L44,1 L46.5,7 L50,5 L53.5,7 L56,1 L61,9 L76,3 L100,14 L90,20 L83,16 L75,24 L67,18 L59,28 L54,22 L50,30 L46,22 L41,28 L33,18 L25,24 L17,16 L10,20 Z"/></svg>
<h1 class="mc-logo">NEXUS<span class="g">LOCAL</span></h1>
<p class="tagline">Your keys&ensp;·&ensp;Your city&ensp;·&ensp;Your rules</p>
<div class="gold-div"></div>
<div class="card" id="card">
<h2>Enter the cave</h2>
<p>Your password unlocks the dashboard</p>
<input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
<div id="error">Wrong password. Try again.</div>
<button id="loginBtn">Login</button>
</div>
<p class="link">New here? <a href="/setup">Set up your keys &rarr;</a></p>
</div>
<script>
const pw=document.getElementById('pw'),err=document.getElementById('error'),
      btn=document.getElementById('loginBtn'),card=document.getElementById('card');
async function submit(){
  const v=pw.value.trim();if(!v)return;
  btn.disabled=true;btn.textContent='Working...';err.style.display='none';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});
    const j=await r.json();
    if(r.status===200&&j.ok){location.href='/';return;}
    throw 0;
  }catch(e){
    err.style.display='block';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  }
  btn.disabled=false;btn.textContent='Login';pw.value='';pw.focus();
}
btn.addEventListener('click',submit);
pw.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
</script>
</body>
</html>
