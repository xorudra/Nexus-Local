<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0c11;color:#e6e9f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:400px;text-align:center}
.eyebrow{font-family:ui-monospace,monospace;letter-spacing:.35em;font-size:11px;color:#3b82f6;margin-bottom:16px}
h1{font-size:1.8rem;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
h1 span{color:#3b82f6}
.sub{color:#9aa3b2;font-size:14px;margin:0 0 32px}
.card{background:#11141b;border:1px solid #1e2430;border-radius:16px;padding:28px;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
input{width:100%;background:#0a0c11;border:1px solid #1e2430;border-radius:12px;color:#e6e9f0;padding:14px 16px;font-size:16px;margin-bottom:12px;transition:border-color .2s}
input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
button{width:100%;background:#3b82f6;color:#fff;border:0;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
button:hover{background:#2563eb}
button:disabled{opacity:.6;cursor:wait}
button:active{transform:scale(.98)}
#error{display:none;background:rgba(239,68,68,.08);border:1px solid #ef4444;border-radius:10px;padding:12px;color:#ef4444;font-size:13px;margin-bottom:12px}
.link{margin-top:20px;color:#6b7280;font-size:13px}
.link a{color:#3b82f6;text-decoration:none;font-weight:600}
.link a:hover{text-decoration:underline}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="wrap">
<div class="eyebrow">NEXUS LOCAL</div>
<h1>Welcome <span>back</span></h1>
<p class="sub">Enter your password to unlock your dashboard</p>
<div class="card" id="card">
<input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
<div id="error">Wrong password. Try again.</div>
<button id="loginBtn">Unlock Dashboard</button>
</div>
<p class="link">New here? <a href="/setup">Set up your keys →</a></p>
</div>
<script>
const pw=document.getElementById('pw'),err=document.getElementById('error'),
      btn=document.getElementById('loginBtn'),card=document.getElementById('card');
async function submit(){
  const v=pw.value.trim();if(!v)return;
  btn.disabled=true;btn.textContent='Unlocking…';err.style.display='none';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});
    const j=await r.json();
    if(r.status===200&&j.ok){location.href='/';return;}
    throw 0;
  }catch(e){
    err.style.display='block';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  }
  btn.disabled=false;btn.textContent='Unlock Dashboard';pw.value='';pw.focus();
}
btn.addEventListener('click',submit);
pw.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
</script>
</body>
</html>
