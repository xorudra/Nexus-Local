<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url(../assets/fonts/sg-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(../assets/fonts/sg-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../assets/fonts/sg-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../assets/fonts/jm-400.woff2) format('woff2'); }
      :root { --ground: #050505; --panel: #0d0d10; --ink: #fafafa; --muted: #a7a7b0; --accent: #38bdf8; --danger: #ff9d97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Space Grotesk', sans-serif; background: var(--ground); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .glow { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(56,189,248,.16), rgba(56,189,248,0) 62%); pointer-events: none; }
      #scene3 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
      .feat { text-align: center; }
      .feat .rule { width: 120px; height: 6px; background: var(--accent); margin: 0 auto 18px; border-radius: 2px; }
      .feat p { font-size: 92px; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene3" data-width="1920" data-height="1080">
      <div id="scene3" class="clip"><div class="glow" data-layout-allow-overflow></div>
        <div id="feat1" class="feat"><div class="rule"></div><p>One shared memory</p></div>
        <div id="feat2" class="feat"><div class="rule"></div><p>Automatic failover</p></div>
        <div id="feat3" class="feat"><div class="rule"></div><p>Your keys, your vault</p></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#feat1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.37);
      tl.fromTo('#feat2', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.93);
      tl.fromTo('#feat3', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 1.46);
      tl.fromTo('.glow', { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: 'power1.out' }, 3.11);
      tl.to('.glow', { opacity: 0.877, duration: 0.25, ease: 'none' }, 0);
      tl.to('.glow', { opacity: 0.924, duration: 0.25, ease: 'none' }, 0.25);
      tl.to('.glow', { opacity: 0.88, duration: 0.25, ease: 'none' }, 0.5);
      tl.to('.glow', { opacity: 0.906, duration: 0.25, ease: 'none' }, 0.75);
      tl.to('.glow', { opacity: 0.896, duration: 0.25, ease: 'none' }, 1.0);
      tl.to('.glow', { opacity: 0.881, duration: 0.25, ease: 'none' }, 1.25);
      tl.to('.glow', { opacity: 0.835, duration: 0.25, ease: 'none' }, 1.5);
      tl.to('.glow', { opacity: 0.919, duration: 0.25, ease: 'none' }, 1.75);
      tl.to('.glow', { opacity: 0.945, duration: 0.25, ease: 'none' }, 2.0);
      tl.to('.glow', { opacity: 0.879, duration: 0.25, ease: 'none' }, 2.25);
      tl.to('.glow', { opacity: 0.969, duration: 0.25, ease: 'none' }, 2.5);
      tl.to('.glow', { opacity: 0.89, duration: 0.25, ease: 'none' }, 2.75);
      tl.to('.glow', { opacity: 0.967, duration: 0.25, ease: 'none' }, 3.0);
      tl.to('.glow', { opacity: 0.908, duration: 0.25, ease: 'none' }, 3.25);
      tl.to('.glow', { opacity: 0.88, duration: 0.25, ease: 'none' }, 3.5);
      tl.to('.glow', { opacity: 0.853, duration: 0.25, ease: 'none' }, 3.75);
      tl.to('.glow', { opacity: 0.89, duration: 0.25, ease: 'none' }, 4.0);
      tl.to('.glow', { opacity: 0.877, duration: 0.25, ease: 'none' }, 4.25);
      tl.to('.glow', { opacity: 0.865, duration: 0.25, ease: 'none' }, 4.5);
      tl.to('.glow', { opacity: 0.89, duration: 0.25, ease: 'none' }, 4.75);
      tl.to('.glow', { opacity: 0.916, duration: 0.25, ease: 'none' }, 5.0);
      tl.to('.glow', { opacity: 0.974, duration: 0.25, ease: 'none' }, 5.25);
      tl.to('.glow', { opacity: 0.896, duration: 0.25, ease: 'none' }, 5.5);
      tl.to('.glow', { opacity: 0.978, duration: 0.25, ease: 'none' }, 5.75);
      tl.to('#scene3', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 5.7);
      window.__timelines['scene3'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
