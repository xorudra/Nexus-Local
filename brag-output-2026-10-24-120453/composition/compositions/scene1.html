<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url(../assets/fonts/sg-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(../assets/fonts/sg-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../assets/fonts/sg-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../assets/fonts/jm-400.woff2) format('woff2'); }
      :root { --ground: #050505; --panel: #0d0d10; --ink: #fafafa; --muted: #a7a7b0; --accent: #38bdf8; --danger: #ff9d97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Space Grotesk', sans-serif; background: var(--ground); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      .glow { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(56,189,248,.16), rgba(56,189,248,0) 62%); pointer-events: none; }
      #scene1 { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      #scene1 h1 { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; color: var(--ink); }
      #scene1 h1 .grad { background: linear-gradient(180deg, #8a8a93, #fafafa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene1" data-width="1920" data-height="1080">
      <div id="scene1" class="clip"><div class="glow" data-layout-allow-overflow></div><h1><span id="s1l1" class="grad">Chat with every AI,</span><br /><span id="s1l2">from one Nexus.</span></h1></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#s1l2', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.5);
      tl.to('.glow', { opacity: 0.896, duration: 0.25, ease: 'none' }, 0);
      tl.to('.glow', { opacity: 0.786, duration: 0.25, ease: 'none' }, 0.25);
      tl.to('.glow', { opacity: 0.892, duration: 0.25, ease: 'none' }, 0.5);
      tl.to('.glow', { opacity: 0.781, duration: 0.25, ease: 'none' }, 0.75);
      tl.to('.glow', { opacity: 0.746, duration: 0.25, ease: 'none' }, 1.0);
      tl.to('.glow', { opacity: 0.791, duration: 0.25, ease: 'none' }, 1.25);
      tl.to('.glow', { opacity: 0.882, duration: 0.25, ease: 'none' }, 1.5);
      tl.to('.glow', { opacity: 0.815, duration: 0.25, ease: 'none' }, 1.75);
      tl.to('.glow', { opacity: 0.722, duration: 0.25, ease: 'none' }, 2.0);
      tl.to('.glow', { opacity: 0.847, duration: 0.25, ease: 'none' }, 2.25);
      tl.to('.glow', { opacity: 0.819, duration: 0.25, ease: 'none' }, 2.5);
      tl.to('.glow', { opacity: 0.83, duration: 0.25, ease: 'none' }, 2.75);
      tl.to('#scene1', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 2.7);
      window.__timelines['scene1'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
