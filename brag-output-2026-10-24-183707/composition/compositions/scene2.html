<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url(../assets/fonts/sg-400.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(../assets/fonts/sg-500.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../assets/fonts/sg-700.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(../assets/fonts/jm-400.woff2) format('woff2'); }
      :root { --ground: #050505; --panel: #0d0d10; --ink: #fafafa; --muted: #a7a7b0; --accent: #38bdf8; --danger: #ff9d97; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Space Grotesk', sans-serif; background: var(--ground); }
      .clip { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #scene2 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      /* Traveling border beam: crisp conic-gradient ring, NO blur, NO shadow.
         The bright segment travels continuously around the picture border
         (3.5s per revolution, looping). */
      .picframe { --ba: 0deg; width: 1560px; padding: 4px; border-radius: 24px;
        background: conic-gradient(from var(--ba), transparent 0deg, transparent 280deg, #38bdf8 310deg, #ffffff 340deg, #38bdf8 355deg, transparent 360deg); }
      .zoomstage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 20px; background: #000; }
      /* #cam carries the cursor-tracking camera: scale + transformOrigin are
         tweened by GSAP so the zoom focal point glides with the cursor. */
      #cam { position: absolute; inset: 0; width: 100%; height: 100%; }
      #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 20px; background: #000; }
      /* Post-production cursor overlay (the raw clip was driven
         programmatically and has no cursor; Camtasia/ScreenFlow-style cursor
         effects are post overlays too). Crisp SVG arrow, tip at (0,0) of its
         box so GSAP x/y place the hot spot exactly. NO blur, NO shadow. */
      #cursor { position: absolute; left: 0; top: 0; width: 28px; height: 28px; z-index: 5; pointer-events: none; }
      #cursor svg { display: block; width: 28px; height: 28px; }
      /* Click ripple: hard-edged ring, NO blur, NO shadow. */
      #ripple { position: absolute; left: 0; top: 0; width: 72px; height: 72px; border: 3px solid #38bdf8; border-radius: 50%; background: transparent; opacity: 0; z-index: 4; pointer-events: none; }
      /* Failover story as video caption text BELOW the real picture — never
         fake UI inside a mock app. */
      .cap { width: 1560px; display: flex; flex-direction: column; gap: 14px; }
      .trace { font-family: 'JetBrains Mono', monospace; font-size: 32px; line-height: 1.6; }
      .trace .fail { color: var(--danger); }
      .trace .ok { color: var(--accent); }
      .trace .hl { background: rgba(56,189,248,.14); padding: 2px 14px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene2" data-width="1920" data-height="1080" data-duration="7">
      <div id="scene2" class="clip"><div id="dashframe" class="picframe"><div class="zoomstage"><div id="cam" data-layout-allow-overflow><video id="chat-video" class="chatvid" data-layout-allow-overflow data-start="0" data-duration="7" data-media-start="0" muted playsinline preload="auto" src="../assets/vid/chat-clip-raw.mp4"></video><div id="cursor"><svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><path d="M0 0 L0 19 L4.5 14.8 L7.5 21 L10.3 19.6 L7.4 14 L15 14 Z" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2" stroke-linejoin="round"/></svg></div><div id="ripple"></div></div></div></div><div class="cap"><div class="trace"><span id="tracefail" class="fail">&#10005; <s>Claude</s> &middot; limit reached</span><br /><span id="traceok" class="ok hl">&#10003; Gemini continues &mdash; same memory</span></div></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Frame entrance + traveling beam (unchanged from v6).
      tl.fromTo('#dashframe', { opacity: 0, y: 24, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }, 0.0);
      tl.fromTo('#dashframe', { '--ba': '0deg' }, { '--ba': '360deg', duration: 3.5, ease: 'none', repeat: 1 }, 0.0);
      // Cursor + camera, synced to the REAL clip timeline (measured from the
      // clip's own frames: typing ~0.7-3.0s, send ~3.4s, answer ~5.8s).
      // All positions are in #cam display space (1560 x 877.5); the cursor
      // tip is the hot spot (SVG tip at 0,0).
      gsap.set('#cam', { scale: 1, transformOrigin: '50% 50%' });
      gsap.set('#cursor', { x: 700, y: 400, scale: 1, opacity: 1 });
      gsap.set('#ripple', { x: 1484 - 36, y: 722 - 36, scale: 0.3, opacity: 0 });
      // 0.0-0.7: cursor glides to the composer as typing starts; camera
      // pushes gently toward the composer.
      tl.to('#cursor', { x: 320, y: 722, duration: 0.7, ease: 'power2.inOut' }, 0.0);
      tl.to('#cam', { scale: 1.10, transformOrigin: '35% 82%', duration: 0.7, ease: 'power2.inOut' }, 0.0);
      // Typing: cursor nudges right following the growing text; camera
      // drifts with it.
      tl.to('#cursor', { x: 520, y: 722, duration: 0.4, ease: 'power1.inOut' }, 1.6);
      tl.to('#cursor', { x: 680, y: 722, duration: 0.4, ease: 'power1.inOut' }, 2.5);
      tl.to('#cam', { scale: 1.15, transformOrigin: '42% 82%', duration: 2.2, ease: 'power1.inOut' }, 0.7);
      // 2.9-3.4: cursor glides to the send button; camera follows it there.
      tl.to('#cursor', { x: 1484, y: 722, duration: 0.5, ease: 'power2.inOut' }, 2.9);
      tl.to('#cam', { scale: 1.20, transformOrigin: '95% 82%', duration: 0.5, ease: 'power2.inOut' }, 2.9);
      // 3.4: CLICK — cursor presses down + ripple ring on the send button,
      // exactly when the clip's message sends.
      tl.to('#cursor', { scale: 0.82, duration: 0.08, ease: 'power2.out', transformOrigin: '50% 50%' }, 3.4);
      tl.to('#cursor', { scale: 1, duration: 0.15, ease: 'power2.out', transformOrigin: '50% 50%' }, 3.48);
      tl.fromTo('#ripple', { scale: 0.3, opacity: 0.9 }, { scale: 1.5, opacity: 0, duration: 0.5, ease: 'power2.out', transformOrigin: '50% 50%' }, 3.4);
      // Captions (unchanged beats from v6, slide + fade).
      tl.fromTo('#tracefail', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 2.5);
      tl.fromTo('#traceok', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 3.2);
      // 3.5-4.6: cursor parks top-right, out of the answer's way; camera
      // drifts back to the thread center while waiting.
      tl.to('#cursor', { x: 1450, y: 150, duration: 0.7, ease: 'power2.inOut' }, 3.5);
      tl.to('#cam', { scale: 1.20, transformOrigin: '50% 45%', duration: 1.1, ease: 'power1.inOut' }, 3.5);
      // 5.8-6.1: TEXT ZOOM — camera pushes further onto the answer bubble +
      // trace (center 46% 46%, measured from the clip frame: the 48% origin
      // clipped the bubble's left edge by ~4px at 1.55x), holds to 6.45,
      // then eases back to the full conversation view before the fade.
      tl.to('#cam', { scale: 1.55, transformOrigin: '46% 46%', duration: 0.3, ease: 'power2.inOut' }, 5.8);
      tl.to('#cam', { scale: 1.20, transformOrigin: '50% 50%', duration: 0.25, ease: 'power2.inOut' }, 6.45);
      tl.to('#scene2', { opacity: 0, duration: 0.3, ease: 'power1.out' }, 6.7);
      window.__timelines['scene2'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
