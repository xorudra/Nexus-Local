services:
  - type: web
    name: nexus-local
    env: python
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r app/requirements.txt
    startCommand: python3 app/server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.0
